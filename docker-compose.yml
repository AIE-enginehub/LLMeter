version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmeter:latest
    container_name: llmeter-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/llmeter
      - AUTH_SECRET=your_super_secret_key_change_me_in_production
      - ADMIN_INITIAL_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: llmeter-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llmeter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llmeter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
