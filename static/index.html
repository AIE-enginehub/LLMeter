<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gongs-credit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .anim-fade-in-up { animation: fadeInUp 0.4s ease-out both; }
    .anim-fade-in { animation: fadeIn 0.3s ease-out both; }
    .anim-slide-in { animation: slideIn 0.3s ease-out both; }
    .anim-delay-1 { animation-delay: 0.05s; }
    .anim-delay-2 { animation-delay: 0.1s; }
    .anim-delay-3 { animation-delay: 0.15s; }
    .anim-delay-4 { animation-delay: 0.2s; }
    .anim-delay-5 { animation-delay: 0.25s; }
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans SC"', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50/50 min-h-screen font-sans text-slate-700">

<!-- ========== 全局应用状态 ========== -->
<div x-data="app()" x-cloak class="min-h-screen">
  <!-- 全局 Toast 提示组件 -->
  <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div x-show="toast.show" 
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 -translate-y-4"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-4"
           class="px-4 py-2.5 rounded-lg shadow-lg border flex items-center gap-2 pointer-events-auto"
           :class="{
             'bg-white border-slate-200 text-slate-800': toast.type === 'info',
             'bg-emerald-50 border-emerald-200 text-emerald-800': toast.type === 'success',
             'bg-amber-50 border-amber-200 text-amber-800': toast.type === 'warning',
             'bg-red-50 border-red-200 text-red-800': toast.type === 'error'
           }">
        <template x-if="toast.type === 'success'">
          <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </template>
        <template x-if="toast.type === 'error'">
          <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </template>
        <span class="text-sm font-medium" x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <!-- 全局确认弹窗 -->
  <template x-if="confirmDialog.show">
    <div class="fixed inset-0 z-[110] flex items-center justify-center anim-fade-in" @click.self="confirmDialog.show = false; confirmDialog.resolve && confirmDialog.resolve(false)">
      <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm"></div>
      <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-sm p-6 anim-slide-in">
        <div class="flex items-start gap-3 mb-5">
          <div class="flex-shrink-0 w-9 h-9 rounded-full bg-amber-50 flex items-center justify-center">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
          </div>
          <p class="text-sm text-slate-700 pt-1.5" x-text="confirmDialog.message"></p>
        </div>
        <div class="flex justify-end gap-2">
          <button @click="confirmDialog.show = false; confirmDialog.resolve && confirmDialog.resolve(false)"
            class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 transition" x-text="t('cancel')"></button>
          <button @click="confirmDialog.show = false; confirmDialog.resolve && confirmDialog.resolve(true)"
            class="px-4 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-500 transition" x-text="t('confirm_action')"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== 登录页 ==================== -->
  <template x-if="!user">
    <div class="min-h-screen flex items-center justify-center relative overflow-hidden">
      <!-- 背景装饰 -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-100 via-blue-50/50 to-violet-50/50"></div>
      <div class="absolute top-20 left-20 w-72 h-72 bg-blue-100/40 rounded-full blur-3xl"></div>
      <div class="absolute bottom-20 right-20 w-96 h-96 bg-violet-100/40 rounded-full blur-3xl"></div>

      <!-- 登录卡片 -->
      <div class="relative z-10 w-full max-w-sm anim-fade-in-up">
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-200/60 p-8">
          <!-- Logo -->
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-slate-700 to-slate-900 rounded-xl mb-4 shadow-lg shadow-slate-300/50">
              <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">gongs-credit</h1>
            <p class="text-sm text-slate-400 mt-1" x-text="t('subtitle')"></p>
          </div>

          <!-- 表单 -->
          <form @submit.prevent="login()">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5" x-text="t('username')"></label>
                <input x-model="loginForm.username" type="text" required
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition"
                  :placeholder="t('username')">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5" x-text="t('password')"></label>
                <input x-model="loginForm.password" type="password" required
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition"
                  :placeholder="t('password')">
              </div>
            </div>
            <template x-if="loginError">
              <p class="mt-3 text-sm text-red-500 anim-fade-in" x-text="loginError"></p>
            </template>
            <button type="submit" :disabled="loginLoading"
              class="mt-6 w-full py-2.5 bg-gradient-to-r from-slate-700 to-slate-800 text-white text-sm font-medium rounded-lg hover:from-slate-800 hover:to-slate-900 transition-all disabled:opacity-60 shadow-sm">
              <span x-show="!loginLoading" x-text="t('login')"></span>
              <span x-show="loginLoading" class="inline-flex items-center gap-2">
                <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span x-text="t('logging_in')"></span>
              </span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== 管理页面（登录后） ==================== -->
  <template x-if="user">
    <div class="min-h-screen anim-fade-in">
      <!-- 顶部导航栏 -->
      <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-slate-200/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
          <!-- Logo + 导航 -->
          <div class="flex items-center gap-8">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 bg-gradient-to-br from-slate-700 to-slate-900 rounded-lg flex items-center justify-center shadow-sm">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
              </div>
              <span class="font-bold text-slate-800 text-sm hidden sm:block">gongs-credit</span>
            </div>
            <div class="flex gap-1">
              <template x-for="tabItem in tabs" :key="tabItem.key">
                <button @click="tab = tabItem.key"
                  :class="tab === tabItem.key ? 'bg-slate-100 text-slate-800 font-medium' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'"
                  class="px-3 py-1.5 rounded-lg text-sm transition-all" x-text="t(tabItem.label)">
                </button>
              </template>
            </div>
          </div>
          <!-- 用户 + 退出 -->
          <div class="flex items-center gap-3">
            
            <button @click="window.toggleLang()" class="text-xs text-slate-500 hover:text-slate-700 transition px-2 py-1 rounded hover:bg-slate-100 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
              <span x-text="t('lang')"></span>
            </button>

            <span class="text-xs text-slate-400" x-text="user.username"></span>
            <button @click="logout()" class="text-xs text-slate-400 hover:text-red-500 transition px-2 py-1 rounded hover:bg-red-50" x-text="t('logout')"></button>
          </div>
        </div>
      </nav>

      <!-- 内容区域 -->
      <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

        <!-- ==================== 概览 Tab ==================== -->
        <div x-show="tab === 'overview'" x-transition class="anim-fade-in-up" x-data="overviewTab()" x-init="load()">
          <!-- 天数切换 -->
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold text-slate-800" x-text="t('overview')"></h2>
            <div class="flex bg-white border border-slate-200 rounded-lg p-0.5">
              <template x-for="d in [7, 14, 30]" :key="d">
                <button @click="days = d; load()"
                  :class="days === d ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="t('days', d)">
                </button>
              </template>
            </div>
          </div>

          <!-- 加载中 -->
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading && stats">
            <div>
              <!-- 统计卡片 -->
              <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                <div class="bg-gradient-to-br from-blue-50 to-white border border-blue-100/60 rounded-xl p-4 anim-fade-in-up">
                  <p class="text-xs text-blue-500/80 font-medium" x-text="t('total_req')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.total_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-emerald-50 to-white border border-emerald-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-1">
                  <p class="text-xs text-emerald-500/80 font-medium" x-text="t('success')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.success_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-white border border-red-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-2">
                  <p class="text-xs text-red-400/80 font-medium" x-text="t('error')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.error_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-violet-50 to-white border border-violet-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-3">
                  <p class="text-xs text-violet-500/80 font-medium" x-text="t('total_token')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="fmtToken(stats.overview.total_tokens)"></p>
                  <p class="text-[10px] text-slate-500 mt-1">
                    <span x-text="t('in')"></span><span x-text="fmtToken(stats.overview.prompt_tokens)"></span> · 
                    <span x-text="t('out')"></span><span x-text="fmtToken(stats.overview.completion_tokens)"></span> · 
                    <span x-text="t('cache')"></span><span x-text="fmtToken(stats.overview.cached_tokens)"></span>
                  </p>
                </div>
                <div class="bg-gradient-to-br from-amber-50 to-white border border-amber-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-4">
                  <p class="text-xs text-amber-500/80 font-medium" x-text="t('avg_time')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1"><span x-text="Math.round(stats.overview.avg_duration_ms)"></span><span class="text-sm font-normal text-slate-400">ms</span></p>
                </div>
              </div>

              <!-- 按服务商 / 模型统计 -->
              <div class="grid lg:grid-cols-2 gap-6">
                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-3">
                  <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700" x-text="t('by_provider')"></h3></div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium" x-text="t('provider')"></th><th class="text-right px-5 py-2.5 font-medium" x-text="t('req_count')"></th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium" x-text="t('error')"></th></tr></thead>
                      <tbody>
                        <template x-for="p in stats.by_provider" :key="p.provider">
                          <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                            <td class="px-5 py-2.5 font-medium text-slate-700" x-text="p.provider"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(p.request_count)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600">
                            <div x-text="fmtToken(p.total_tokens)"></div>
                            <div class="text-[10px] text-slate-400 mt-0.5"><span x-text="t('in')"></span><span x-text="fmtToken(p.prompt_tokens)"></span> · <span x-text="t('out')"></span><span x-text="fmtToken(p.completion_tokens)"></span> · <span x-text="t('cache')"></span><span x-text="fmtToken(p.cached_tokens)"></span></div>
                          </td>
                            <td class="px-5 py-2.5 text-right"><span :class="p.error_count > 0 ? 'text-red-500' : 'text-slate-400'" x-text="p.error_count"></span></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="stats.by_provider.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
                  </div>
                </div>

                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-4">
                  <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700" x-text="t('by_model')"></h3></div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium" x-text="t('model')"></th><th class="text-right px-5 py-2.5 font-medium" x-text="t('req_count')"></th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium" x-text="t('avg_time')"></th></tr></thead>
                      <tbody>
                        <template x-for="m in stats.by_model" :key="m.model">
                          <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                            <td class="px-5 py-2.5 font-mono text-xs text-slate-700" x-text="m.model"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(m.request_count)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600">
                            <div x-text="fmtToken(m.total_tokens)"></div>
                            <div class="text-[10px] text-slate-400 mt-0.5"><span x-text="t('in')"></span><span x-text="fmtToken(m.prompt_tokens)"></span> · <span x-text="t('out')"></span><span x-text="fmtToken(m.completion_tokens)"></span> · <span x-text="t('cache')"></span><span x-text="fmtToken(m.cached_tokens)"></span></div>
                          </td>
                            <td class="px-5 py-2.5 text-right text-slate-500"><span x-text="Math.round(m.avg_duration_ms)"></span>ms</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="stats.by_model.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- ==================== 组织管理 Tab ==================== -->
        <div x-show="tab === 'orgs'" x-transition class="anim-fade-in-up" x-data="orgsTab()" x-init="load()">
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading">
            <div class="flex gap-6" style="min-height: calc(100vh - 140px);">
              <!-- 左侧组织列表 -->
              <div class="w-64 flex-shrink-0">
                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                  <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-700" x-text="t('org_list')"></h3>
                    <button @click="showCreateOrg = true" class="text-xs px-2.5 py-1 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition" x-text="t('new')"></button>
                  </div>
                  <div class="p-2 max-h-[60vh] overflow-y-auto">
                    <template x-for="org in orgs" :key="org.id">
                      <button @click="selectOrg(org)"
                        :class="selectedOrg && selectedOrg.id === org.id ? 'bg-slate-100 text-slate-800' : 'text-slate-600 hover:bg-slate-50'"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm transition flex items-center justify-between group">
                        <span class="truncate" x-text="org.name"></span>
                        <span :class="org.is_active ? 'bg-emerald-400' : 'bg-slate-300'" class="w-1.5 h-1.5 rounded-full flex-shrink-0"></span>
                      </button>
                    </template>
                    <template x-if="orgs.length === 0"><p class="text-center text-slate-400 text-xs py-4" x-text="t('no_org')"></p></template>
                  </div>
                </div>
              </div>

              <!-- 右侧详情 -->
              <div class="flex-1 min-w-0">
                <template x-if="!selectedOrg">
                  <div class="flex items-center justify-center h-64 text-slate-400 text-sm" x-text="t('select_org')"></div>
                </template>

                <template x-if="selectedOrg">
                  <div class="space-y-6 anim-fade-in-up">
                    <!-- 组织信息 -->
                    <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-slate-700" x-text="t('org_info')"></h3>
                        <div class="flex gap-2">
                          <button @click="saveOrg()" class="text-xs px-3 py-1.5 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition" x-text="t('save')"></button>
                          <button @click="deleteOrg()" class="text-xs px-3 py-1.5 text-red-500 border border-red-200 rounded-md hover:bg-red-50 transition" x-text="t('delete')"></button>
                        </div>
                      </div>
                      <div class="p-5 space-y-4">
                        <div class="grid grid-cols-3 gap-4">
                          <div>
                            <label class="block text-xs text-slate-400 mb-1" x-text="t('name')"></label>
                            <input x-model="editOrg.name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                          </div>
                          <div>
                            <label class="block text-xs text-slate-400 mb-1" x-text="t('slug')"></label>
                            <input x-model="editOrg.slug" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">

<script>
// ============================================================
// 工具函数

/** Token 格式化：>= 1M 显示 "1.2M"，>= 1K 显示 "1.2K" */
function fmtToken(n) {
  if (n == null) return '-';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

/** 数值格式化（带千分位） */
function formatNum(n) {
  if (n == null) return '-';
  const locale = window.lang === 'en' ? 'en-US' : 'zh-CN';
  return Number(n).toLocaleString(locale);
}

function fmtTime(t) {
  if (!t) return '-';
  const locale = window.lang === 'en' ? 'en-US' : 'zh-CN';
  return new Date(t).toLocaleString(locale);
}

window.t = function(key, ...args) {

window.showToast = function(message, type = 'success') {
  const appEl = document.querySelector('[x-data="app()"]');
  const data = appEl && appEl._x_dataStack && appEl._x_dataStack[0];
  if (data && data.toasts) {
    const id = Date.now();
    data.toasts.push({ id, message, type, show: true });
    setTimeout(() => {
      const toast = data.toasts.find(t => t.id === id);
      if (toast) toast.show = false;
      setTimeout(() => {
        data.toasts = data.toasts.filter(t => t.id !== id);
      }, 300);
    }, 3000);
  } else {
    console.warn('[showToast fallback]', message);
  }
};

window.showConfirm = function(message) {
  return new Promise((resolve) => {
    const appEl = document.querySelector('[x-data="app()"]');
    const data = appEl && appEl._x_dataStack && appEl._x_dataStack[0];
    if (data) {
      data.confirmDialog = { show: true, message, resolve };
    } else {
      resolve(false);
    }
  });
};

/** 复制文本到剪贴板 */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // 兼容非 HTTPS 环境 (HTTP 协议下 navigator.clipboard 不可用)
      let textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      document.execCommand('copy');
      textArea.remove();
    }
    window.showToast(window.t('copy_success'));
  } catch (err) {
    window.showToast(window.t('copy_fail'), "error");
  }
}

/** 封装 fetch 请求 */
async function api(url, options = {}) {
  const res = await fetch(url, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
  if (res.status === 204) return null;
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Request failed (${res.status})`);
  }
  return res.json();
}

function app() {
  return {
    t: window.t,
    user: null,
    tab: 'overview',
    tabs: [
      { key: 'overview', label: 'overview' },
      { key: 'orgs', label: 'orgs' },
      { key: 'logs', label: 'logs' },
      { key: 'usage', label: 'usage' },
      { key: 'settings', label: 'settings' },
    ],
    
    

    loginForm: { username: '', password: '' },
    loginLoading: false,
    loginError: '',
    toasts: [],
    confirmDialog: { show: false, message: '', resolve: null },
    async init() {
      try {
        this.user = await api('/api/auth/me');
      } catch {
        this.user = null;
      }
    },

    async login() {
      this.loginLoading = true;
      this.loginError = '';
      try {
        const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify(this.loginForm) });
        this.user = res.user;
        window.showToast(t('login_success'));
      } catch (e) {
        this.loginError = e.message;
        window.showToast(e.message, 'error');
      } finally {
        this.loginLoading = false;
      }
    },

    async logout() {
      try { 
        await api('/api/auth/logout', { method: 'POST' }); 
        window.showToast(t('logout_success'));
      } catch {}
      this.user = null;
    },
  };
}

// ============================================================
// 组织管理 Tab
// ============================================================
function orgsTab() {
  return {
    loading: false,
    orgs: [],
    selectedOrg: null,
    editOrg: { credit: 0 },
    keys: [],
    models: [],
    showCreateOrg: false,
    showCreateKey: false,
    showModelForm: false,
    showRecharge: false,
    showCreditLogs: false,
    createdKey: null,
    newOrg: { name: '', slug: '' },
    newKeyName: '',
    rechargeAmount: 0,
    rechargeNote: '',
    creditLogs: [],
    modelForm: { id: null, name: '', protocol: 'openai', model_patterns: '', base_url: '', real_api_key: '', priority: 0 },

    async load() {
      this.loading = true;
      try { 
        this.orgs = await api('/api/orgs'); 
        if (this.orgs.length > 0) {
          if (!this.selectedOrg) {
            await this.selectOrg(this.orgs[0]);
          } else {
            const updatedOrg = this.orgs.find(o => o.id === this.selectedOrg.id);
            if (updatedOrg) {
              await this.selectOrg(updatedOrg);
            } else {
              await this.selectOrg(this.orgs[0]);
            }
          }
        } else {
          this.selectedOrg = null;
        }
      } catch { this.orgs = []; }
      this.loading = false;
    },

    async selectOrg(org) {
      this.selectedOrg = org;
      this.editOrg = { name: org.name, slug: org.slug, is_active: org.is_active ? 'true' : 'false', credit: org.credit || 0 };
      await Promise.all([this.loadKeys(), this.loadModels()]);
    },

    async loadKeys() {
      try { this.keys = await api(`/api/orgs/${this.selectedOrg.id}/keys`); } catch { this.keys = []; }
    },

    async loadModels() {
      try { this.models = await api(`/api/orgs/${this.selectedOrg.id}/models`); } catch { this.models = []; }
    },

    async createOrg() {
      try {
        await api('/api/orgs', { method: 'POST', body: JSON.stringify(this.newOrg) });
        this.newOrg = { name: '', slug: '' };
        this.showCreateOrg = false;
        window.showToast(t('org_created'));
        await this.load();
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async saveOrg() {
      try {
        const updated = await api(`/api/orgs/${this.selectedOrg.id}`, { method: 'PUT', body: JSON.stringify({
          name: this.editOrg.name,
          slug: this.editOrg.slug,
          is_active: this.editOrg.is_active === 'true' || this.editOrg.is_active === true
        }) });
        Object.assign(this.selectedOrg, updated);
        this.editOrg.is_active = updated.is_active; // 确保保存后状态同步
        window.showToast(t('save_success'));
        await this.load();
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async deleteOrg() {
      if (!await window.showConfirm(t('confirm_delete_org'))) return;
      try {
        await api(`/api/orgs/${this.selectedOrg.id}`, { method: 'DELETE' });
        this.selectedOrg = null;
        window.showToast(t('org_deleted'));
        await this.load();
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async rechargeCredit() {
      try {
        const updated = await api(`/api/orgs/${this.selectedOrg.id}/credit`, {
          method: 'POST',
          body: JSON.stringify({ amount: Number(this.rechargeAmount), note: this.rechargeNote })
        });
        Object.assign(this.selectedOrg, updated);
        this.editOrg.credit = updated.credit;
        this.showRecharge = false;
        this.rechargeAmount = 0;
        this.rechargeNote = '';
        window.showToast(t('recharge_success'));
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async loadCreditLogs() {
      try {
        this.creditLogs = await api(`/api/orgs/${this.selectedOrg.id}/credit_logs`);
        this.showCreditLogs = true;
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async createKey() {
      try {
        const res = await api(`/api/orgs/${this.selectedOrg.id}/keys`, { method: 'POST', body: JSON.stringify({ name: this.newKeyName }) });
        this.createdKey = res;
        this.newKeyName = '';
        this.showCreateKey = false;
        window.showToast(t('key_created'));
        await this.loadKeys();
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async deleteKey(id) {
      if (!await window.showConfirm(t('confirm_delete_key'))) return;
      try {
        await api(`/api/keys/${id}`, { method: 'DELETE' });
        window.showToast(t('key_deleted'));
        await this.loadKeys();
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    openModelForm(model = null) {
      if (model) {
        this.modelForm = { id: model.id, name: model.name, protocol: model.protocol, model_patterns: model.model_patterns, base_url: model.base_url, real_api_key: model.real_api_key, priority: model.priority };
      } else {
        this.modelForm = { id: null, name: '', protocol: 'openai', model_patterns: '', base_url: '', real_api_key: '', priority: 0 };
      }
      this.showModelForm = true;
    },

    async saveModel() {
      try {
        if (this.modelForm.id) {
          await api(`/api/models/${this.modelForm.id}`, { method: 'PUT', body: JSON.stringify(this.modelForm) });
          window.showToast(t('model_updated'));
        } else {
          await api(`/api/orgs/${this.selectedOrg.id}/models`, { method: 'POST', body: JSON.stringify(this.modelForm) });
          window.showToast(t('model_added'));
        }
        this.showModelForm = false;
        await this.loadModels();
      } catch (e) { window.showToast(e.message, 'error'); }
    },

    async deleteModel(id) {
      if (!await window.showConfirm(t('confirm_delete_model'))) return;
      try {
        await api(`/api/models/${id}`, { method: 'DELETE' });
        window.showToast(t('model_deleted'));
        await this.loadModels();
      } catch (e) { window.showToast(e.message, 'error'); }
    },
  };
}

// ============================================================
// 调用日志 Tab
// ============================================================
function logsTab() {
  return {
    loading: false,
    logs: [],
    orgs: [],
    total: 0,
    page: 1,
    pageSize: 20,
    filter: { org_id: '', status: '' },
    logDetail: null,

    get totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },

    async load() {
      this.loading = true;
      try {
        // 并行加载组织列表（用于筛选下拉）
        if (this.orgs.length === 0) {
          this.orgs = await api('/api/orgs');
        }
        let url = `/api/logs?page=${this.page}&pageSize=${this.pageSize}`;
        if (this.filter.org_id) url += `&org_id=${this.filter.org_id}`;
        if (this.filter.status) url += `&status=${this.filter.status}`;
        const res = await api(url);
        this.logs = res.data;
        this.total = res.total;
      } catch { this.logs = []; }
      this.loading = false;
    },

    async viewLog(id) {
      try {
        this.logDetail = await api(`/api/logs/${id}`);
      } catch (e) { window.showToast(e.message, 'error'); }
    },
  };
}

// ============================================================
// 用量统计 Tab
// ============================================================
function usageTab() {
  return {
    days: 7,
    loading: false,
    stats: null,

    get maxReq() {
      if (!this.stats) return 0;
      return Math.max(...this.stats.daily_stats.map(d => d.request_count), 0);
    },

    get maxToken() {
      if (!this.stats) return 0;
      return Math.max(...this.stats.daily_stats.map(d => d.total_tokens), 0);
    },

    async load() {
      this.loading = true;
      try {
        this.stats = await api(`/api/stats?days=${this.days}`);
      } catch { this.stats = null; }
      this.loading = false;
    },
  };
}
