<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMeter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .anim-fade-in-up { animation: fadeInUp 0.4s ease-out both; }
    .anim-fade-in { animation: fadeIn 0.3s ease-out both; }
    .anim-slide-in { animation: slideIn 0.3s ease-out both; }
    .anim-delay-1 { animation-delay: 0.05s; }
    .anim-delay-2 { animation-delay: 0.1s; }
    .anim-delay-3 { animation-delay: 0.15s; }
    .anim-delay-4 { animation-delay: 0.2s; }
    .anim-delay-5 { animation-delay: 0.25s; }
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans SC"', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50/50 min-h-screen font-sans text-slate-700">

<!-- ========== 全局应用状态 ========== -->
<div x-data="app()" x-cloak class="min-h-screen">
  <!-- 全局 Toast 提示组件 -->
  <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div x-show="toast.show" 
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 -translate-y-4"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-4"
           class="px-4 py-2.5 rounded-lg shadow-lg border flex items-center gap-2 pointer-events-auto"
           :class="{
             'bg-white border-slate-200 text-slate-800': toast.type === 'info',
             'bg-emerald-50 border-emerald-200 text-emerald-800': toast.type === 'success',
             'bg-amber-50 border-amber-200 text-amber-800': toast.type === 'warning',
             'bg-red-50 border-red-200 text-red-800': toast.type === 'error'
           }">
        <template x-if="toast.type === 'success'">
          <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </template>
        <template x-if="toast.type === 'error'">
          <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </template>
        <span class="text-sm font-medium" x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <!-- 全局确认弹窗 -->
  <template x-if="confirmDialog.show">
    <div class="fixed inset-0 z-[110] flex items-center justify-center anim-fade-in" @click.self="confirmDialog.show = false; confirmDialog.resolve && confirmDialog.resolve(false)">
      <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm"></div>
      <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-sm p-6 anim-slide-in">
        <div class="flex items-start gap-3 mb-5">
          <div class="flex-shrink-0 w-9 h-9 rounded-full bg-amber-50 flex items-center justify-center">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
          </div>
          <p class="text-sm text-slate-700 pt-1.5" x-text="confirmDialog.message"></p>
        </div>
        <div class="flex justify-end gap-2">
          <button @click="confirmDialog.show = false; confirmDialog.resolve && confirmDialog.resolve(false)"
            class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 transition" x-text="t('cancel')"></button>
          <button @click="confirmDialog.show = false; confirmDialog.resolve && confirmDialog.resolve(true)"
            class="px-4 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-500 transition" x-text="t('confirm_action')"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== 登录页 ==================== -->
  <template x-if="!user">
    <div class="min-h-screen flex items-center justify-center relative overflow-hidden">
      <!-- 背景装饰 -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-100 via-blue-50/50 to-violet-50/50"></div>
      <div class="absolute top-20 left-20 w-72 h-72 bg-blue-100/40 rounded-full blur-3xl"></div>
      <div class="absolute bottom-20 right-20 w-96 h-96 bg-violet-100/40 rounded-full blur-3xl"></div>

      <!-- 登录卡片 -->
      <div class="relative z-10 w-full max-w-sm anim-fade-in-up">
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-200/60 p-8">
          <!-- Logo -->
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-slate-700 to-slate-900 rounded-xl mb-4 shadow-lg shadow-slate-300/50">
              <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">LLMeter</h1>
            <p class="text-sm text-slate-400 mt-1" x-text="t('subtitle')"></p>
          </div>

          <!-- 表单 -->
          <form @submit.prevent="login()">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5" x-text="t('username')"></label>
                <input x-model="loginForm.username" type="text" required
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition"
                  :placeholder="t('username')">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5" x-text="t('password')"></label>
                <input x-model="loginForm.password" type="password" required
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition"
                  :placeholder="t('password')">
              </div>
            </div>
            <template x-if="loginError">
              <p class="mt-3 text-sm text-red-500 anim-fade-in" x-text="loginError"></p>
            </template>
            <button type="submit" :disabled="loginLoading"
              class="mt-6 w-full py-2.5 bg-gradient-to-r from-slate-700 to-slate-800 text-white text-sm font-medium rounded-lg hover:from-slate-800 hover:to-slate-900 transition-all disabled:opacity-60 shadow-sm">
              <span x-show="!loginLoading" x-text="t('login')"></span>
              <span x-show="loginLoading" class="inline-flex items-center gap-2">
                <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span x-text="t('logging_in')"></span>
              </span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== 管理页面（登录后） ==================== -->
  <template x-if="user">
    <div class="min-h-screen anim-fade-in">
      <!-- 顶部导航栏 -->
      <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-slate-200/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
          <!-- Logo + 导航 -->
          <div class="flex items-center gap-8">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 bg-gradient-to-br from-slate-700 to-slate-900 rounded-lg flex items-center justify-center shadow-sm">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
              </div>
              <span class="font-bold text-slate-800 text-sm hidden sm:block">LLMeter</span>
            </div>
            <div class="flex gap-1">
              <template x-for="tabItem in tabs" :key="tabItem.key">
                <button @click="tab = tabItem.key"
                  :class="tab === tabItem.key ? 'bg-slate-100 text-slate-800 font-medium' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'"
                  class="px-3 py-1.5 rounded-lg text-sm transition-all" x-text="t(tabItem.label)">
                </button>
              </template>
            </div>
          </div>
          <!-- 用户 + 退出 -->
          <div class="flex items-center gap-3">
            
            <button @click="window.toggleLang()" class="text-xs text-slate-500 hover:text-slate-700 transition px-2 py-1 rounded hover:bg-slate-100 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
              <span x-text="t('lang')"></span>
            </button>

            <span class="text-xs text-slate-400" x-text="user.username"></span>
            <button @click="logout()" class="text-xs text-slate-400 hover:text-red-500 transition px-2 py-1 rounded hover:bg-red-50" x-text="t('logout')"></button>
          </div>
        </div>
      </nav>

      <!-- 内容区域 -->
      <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

        <!-- ==================== 概览 Tab ==================== -->
        <div x-show="tab === 'overview'" x-transition class="anim-fade-in-up" x-data="overviewTab()" x-init="load()">
          <!-- 天数切换 -->
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold text-slate-800" x-text="t('overview')"></h2>
            <div class="flex bg-white border border-slate-200 rounded-lg p-0.5">
              <template x-for="d in [7, 14, 30]" :key="d">
                <button @click="days = d; load()"
                  :class="days === d ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="t('days', d)">
                </button>
              </template>
            </div>
          </div>

          <!-- 加载中 -->
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading && stats">
            <div>
              <!-- 统计卡片 -->
              <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                <div class="bg-gradient-to-br from-blue-50 to-white border border-blue-100/60 rounded-xl p-4 anim-fade-in-up">
                  <p class="text-xs text-blue-500/80 font-medium" x-text="t('total_req')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.total_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-emerald-50 to-white border border-emerald-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-1">
                  <p class="text-xs text-emerald-500/80 font-medium" x-text="t('success')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.success_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-white border border-red-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-2">
                  <p class="text-xs text-red-400/80 font-medium" x-text="t('error')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.error_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-violet-50 to-white border border-violet-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-3">
                  <p class="text-xs text-violet-500/80 font-medium" x-text="t('total_token')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="fmtToken(stats.overview.total_tokens)"></p>
                  <p class="text-[10px] text-slate-500 mt-1">
                    <span x-text="t('in')"></span><span x-text="fmtToken(stats.overview.prompt_tokens)"></span> · 
                    <span x-text="t('out')"></span><span x-text="fmtToken(stats.overview.completion_tokens)"></span> · 
                    <span x-text="t('cache')"></span><span x-text="fmtToken(stats.overview.cached_tokens)"></span>
                  </p>
                </div>
                <div class="bg-gradient-to-br from-amber-50 to-white border border-amber-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-4">
                  <p class="text-xs text-amber-500/80 font-medium" x-text="t('avg_time')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1"><span x-text="Math.round(stats.overview.avg_duration_ms)"></span><span class="text-sm font-normal text-slate-400">ms</span></p>
                </div>
              </div>

              <!-- 按组织 / 模型统计 -->
              <div class="grid lg:grid-cols-2 gap-6">
                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-3">
                  <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700" x-text="t('by_org')"></h3></div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium" x-text="t('orgs')"></th><th class="text-right px-5 py-2.5 font-medium" x-text="t('req_count')"></th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium" x-text="t('credit_cost')"></th><th class="text-right px-5 py-2.5 font-medium" x-text="t('error')"></th></tr></thead>
                      <tbody>
                        <template x-for="og in stats.by_org" :key="og.org_id">
                          <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                            <td class="px-5 py-2.5 font-medium text-slate-700" x-text="og.org_name"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(og.request_count)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600">
                              <div x-text="fmtToken(og.total_tokens)"></div>
                              <div class="text-[10px] text-slate-400 mt-0.5"><span x-text="t('in')"></span><span x-text="fmtToken(og.prompt_tokens)"></span> · <span x-text="t('out')"></span><span x-text="fmtToken(og.completion_tokens)"></span> · <span x-text="t('cache')"></span><span x-text="fmtToken(og.cached_tokens)"></span></div>
                            </td>
                            <td class="px-5 py-2.5 text-right text-indigo-600 font-medium" x-text="Number(og.total_credit_cost || 0).toFixed(4)"></td>
                            <td class="px-5 py-2.5 text-right"><span :class="og.error_count > 0 ? 'text-red-500' : 'text-slate-400'" x-text="og.error_count"></span></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="stats.by_org.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
                  </div>
                </div>

                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-4">
                  <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700" x-text="t('by_model')"></h3></div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium" x-text="t('model')"></th><th class="text-right px-5 py-2.5 font-medium" x-text="t('req_count')"></th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium" x-text="t('avg_time')"></th></tr></thead>
                      <tbody>
                        <template x-for="m in stats.by_model" :key="m.model">
                          <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                            <td class="px-5 py-2.5 font-mono text-xs text-slate-700" x-text="m.model"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(m.request_count)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600">
                            <div x-text="fmtToken(m.total_tokens)"></div>
                            <div class="text-[10px] text-slate-400 mt-0.5"><span x-text="t('in')"></span><span x-text="fmtToken(m.prompt_tokens)"></span> · <span x-text="t('out')"></span><span x-text="fmtToken(m.completion_tokens)"></span> · <span x-text="t('cache')"></span><span x-text="fmtToken(m.cached_tokens)"></span></div>
                          </td>
                            <td class="px-5 py-2.5 text-right text-slate-500"><span x-text="Math.round(m.avg_duration_ms)"></span>ms</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="stats.by_model.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- ==================== 组织管理 Tab ==================== -->
        <div x-show="tab === 'orgs'" x-transition class="anim-fade-in-up" x-data="orgsTab()" x-init="load()">
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading">
            <div class="flex gap-6" style="min-height: calc(100vh - 140px);">
              <!-- 左侧组织列表 -->
              <div class="w-64 flex-shrink-0">
                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                  <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-700" x-text="t('org_list')"></h3>
                    <button @click="showCreateOrg = true" class="text-xs px-2.5 py-1 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition" x-text="t('new')"></button>
                  </div>
                  <div class="p-2 max-h-[60vh] overflow-y-auto">
                    <template x-for="org in orgs" :key="org.id">
                      <button @click="selectOrg(org)"
                        :class="selectedOrg && selectedOrg.id === org.id ? 'bg-slate-100 text-slate-800' : 'text-slate-600 hover:bg-slate-50'"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm transition flex items-center justify-between group">
                        <span class="truncate" x-text="org.name"></span>
                        <span :class="org.is_active ? 'bg-emerald-400' : 'bg-slate-300'" class="w-1.5 h-1.5 rounded-full flex-shrink-0"></span>
                      </button>
                    </template>
                    <template x-if="orgs.length === 0"><p class="text-center text-slate-400 text-xs py-4" x-text="t('no_org')"></p></template>
                  </div>
                </div>
              </div>

              <!-- 右侧详情 -->
              <div class="flex-1 min-w-0">
                <template x-if="!selectedOrg">
                  <div class="flex items-center justify-center h-64 text-slate-400 text-sm" x-text="t('select_org')"></div>
                </template>

                <template x-if="selectedOrg">
                  <div class="space-y-6 anim-fade-in-up">
                    <!-- 组织信息 -->
                    <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-slate-700" x-text="t('org_info')"></h3>
                        <div class="flex gap-2">
                          <button @click="saveOrg()" class="text-xs px-3 py-1.5 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition" x-text="t('save')"></button>
                          <button @click="deleteOrg()" class="text-xs px-3 py-1.5 text-red-500 border border-red-200 rounded-md hover:bg-red-50 transition" x-text="t('delete')"></button>
                        </div>
                      </div>
                      <div class="p-5 space-y-5">
                        <!-- 基本信息：名称 / 标识 / 状态 -->
                        <div class="grid grid-cols-3 gap-4">
                          <div>
                            <label class="block text-xs text-slate-400 mb-1" x-text="t('name')"></label>
                            <input x-model="editOrg.name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                          </div>

            <select x-show="filter.org_id" x-model="filter.api_key_id" @change="page = 1; load()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
              <option value="" x-text="t('all_keys')"></option>
              <template x-for="k in orgKeys" :key="k.id"><option :value="k.id" x-text="k.name + ' (' + k.key_prefix + '…)'"></option></template>
            </select>
            <select x-model="filter.status" @change="page = 1; load()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
              <option value="" x-text="t('all_status')"></option>
              <option value="success" x-text="t('success')"></option>
              <option value="error" x-text="t('error')"></option>
              <option value="pending" x-text="t('pending')"></option>
            </select>
            <!-- 模型名称模糊搜索 -->
            <div class="relative">
              <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input x-model="filter.model" @input="onModelInput()" type="text"
                class="pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition w-48"
                :placeholder="t('model_search_ph')">
            </div>
            <!-- 时间范围 -->
            <div class="flex items-center gap-1.5 relative">
              <button @click="_drp_open('logStart', filter.start_time)" class="px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs hover:bg-slate-100 transition min-w-[100px] text-left" x-text="_drp_fmtDisplay(filter.start_time)"></button>
              <span class="text-slate-400 text-xs">-</span>
              <button @click="_drp_open('logEnd', filter.end_time)" class="px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs hover:bg-slate-100 transition min-w-[100px] text-left" x-text="_drp_fmtDisplay(filter.end_time)"></button>
              <button x-show="filter.start_time || filter.end_time" @click="clearDateRange()" class="text-slate-400 hover:text-red-400 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
              <!-- 日历面板 -->
              <div x-show="_drp_showPanel === 'logStart' || _drp_showPanel === 'logEnd'" @click.away="_drp_showPanel = ''"
                class="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg p-3 z-50 w-64">
                <div class="flex items-center justify-between mb-2">
                  <button @click="_drp_prevMonth()" class="p-1 hover:bg-slate-100 rounded text-slate-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
                  <span class="text-sm font-medium text-slate-700" x-text="_drp_monthLabel"></span>
                  <button @click="_drp_nextMonth()" class="p-1 hover:bg-slate-100 rounded text-slate-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
                </div>
                <div class="grid grid-cols-7 gap-0.5 text-center text-[10px] text-slate-400 mb-1">
                  <template x-for="wd in _drp_weekDays"><span x-text="wd"></span></template>
                </div>
                <div class="grid grid-cols-7 gap-0.5 text-center">
                  <template x-for="(cell, ci) in _drp_days" :key="ci">
                    <button @click="_drp_showPanel === 'logStart' ? selectStartDate(cell) : selectEndDate(cell)"
                      :class="[cell.cur ? 'text-slate-700 hover:bg-indigo-50 hover:text-indigo-600' : 'text-slate-300 pointer-events-none', _drp_isToday(cell) && 'bg-indigo-500 text-white hover:bg-indigo-600 hover:text-white rounded-full']"
                      class="w-8 h-8 text-xs rounded-full transition" x-text="cell.d"></button>
                  </template>
                </div>
              </div>
            </div>
            <div class="flex-1"></div>
            <span class="text-xs text-slate-400" x-show="total > 0" x-text="t('total_records', total)"></span>
            <button @click="load()" :disabled="loading" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition disabled:opacity-40" :title="t('refresh')">
              <svg class="w-4 h-4" :class="loading && 'animate-spin'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
          </div>

          <!-- 加载中 -->
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading">
            <div>
              <!-- 日志表格 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead><tr class="text-xs text-slate-400 border-b border-slate-100 bg-slate-50/50"><th class="text-left px-4 py-2.5 font-medium" x-text="t('time')"></th><th class="text-left px-4 py-2.5 font-medium" x-text="t('provider')"></th><th class="text-left px-4 py-2.5 font-medium" x-text="t('model')"></th><th class="text-center px-4 py-2.5 font-medium">SSE</th><th class="text-left px-4 py-2.5 font-medium" x-text="t('status')"></th><th class="text-right px-4 py-2.5 font-medium">Token</th><th class="text-right px-4 py-2.5 font-medium" x-text="t('consume_credit')"></th><th class="text-right px-4 py-2.5 font-medium" x-text="t('duration')"></th></tr></thead>
                    <tbody>
                      <template x-for="log in logs" :key="log.id">
                        <tr @click="viewLog(log.id)" class="border-b border-slate-50 hover:bg-blue-50/50 cursor-pointer transition">
                          <td class="px-4 py-2.5 text-xs text-slate-500 whitespace-nowrap" x-text="fmtTime(log.created_at)"></td>
                          <td class="px-4 py-2.5 text-slate-600" x-text="log.provider"></td>
                          <td class="px-4 py-2.5 font-mono text-xs text-slate-600" x-text="log.model || '-'"></td>
                          <td class="px-4 py-2.5 text-center"><span x-show="log.is_stream" class="text-xs text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded">SSE</span><span x-show="!log.is_stream" class="text-xs text-slate-300">-</span></td>
                          <td class="px-4 py-2.5">
                            <span :class="{
                              'text-emerald-600 bg-emerald-50': log.status === 'success',
                              'text-red-500 bg-red-50': log.status === 'error',
                              'text-amber-600 bg-amber-50': log.status === 'pending'
                            }" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium">
                              <span :class="{
                                'bg-emerald-400': log.status === 'success',
                                'bg-red-400': log.status === 'error',
                                'bg-amber-400': log.status === 'pending'
                              }" class="w-1.5 h-1.5 rounded-full"></span>
                              <span x-text="log.status === 'success' ? t('success') : log.status === 'error' ? t('error') : t('pending')"></span>
                            </span>
                          </td>
                        <td class="px-4 py-2.5 text-right text-xs text-slate-500">
                          <div class="font-medium text-slate-600" x-text="fmtToken(log.total_tokens)"></div>
                          <div class="text-[10px] text-slate-400 mt-0.5"><span x-text="t('in')"></span><span x-text="fmtToken(log.prompt_tokens)"></span> · <span x-text="t('out')"></span><span x-text="fmtToken(log.completion_tokens)"></span> · <span x-text="t('cache')"></span><span x-text="fmtToken(log.cached_tokens)"></span></div>
                        </td>
                        <td class="px-4 py-2.5 text-right text-xs font-medium">
                          <span class="text-indigo-600" x-text="log.credit_cost ? Number(log.credit_cost).toFixed(4) : '-'"></span>
                          <span x-show="log.is_long_context" class="ml-1 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-orange-100 text-orange-700" x-text="t('long_ctx_tag')"></span>
                        </td>
                          <td class="px-4 py-2.5 text-right text-xs text-slate-500" x-text="log.duration_ms != null ? log.duration_ms + 'ms' : '-'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <template x-if="logs.length === 0"><p class="text-center text-slate-400 text-sm py-10" x-text="t('no_logs')"></p></template>
                </div>
              </div>

              <!-- 分页 -->
              <div x-show="totalPages > 1" class="flex items-center justify-center gap-2 mt-4">
                <button @click="page = Math.max(1, page - 1); load()" :disabled="page <= 1" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 transition" x-text="t('prev_page')"></button>
                <span class="text-sm text-slate-500" x-text="page + ' / ' + totalPages"></span>
                <button @click="page = Math.min(totalPages, page + 1); load()" :disabled="page >= totalPages" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 transition" x-text="t('next_page')"></button>
              </div>
            </div>
          </template>

          <!-- 日志详情弹窗（teleport 到 body 避免被 sticky nav 遮挡） -->
          <template x-if="logDetail">
            <template x-teleport="body">
              <div class="fixed inset-0 z-[9999] flex items-center justify-center p-6 anim-fade-in">
                <div class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm" @click="logDetail = null"></div>
                <div class="relative bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-4xl flex flex-col" style="max-height: calc(85vh - 2rem);">
                  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 flex-shrink-0">
                    <div class="flex items-center gap-3">
                      <h3 class="text-base font-semibold text-slate-800" x-text="t('log_detail')"></h3>
                      <span class="text-xs font-mono text-slate-400 bg-slate-50 px-2 py-0.5 rounded" x-text="logDetail.method + ' ' + logDetail.path"></span>
                    </div>
                    <button @click="logDetail = null" class="text-slate-400 hover:text-slate-600 transition p-1 rounded-lg hover:bg-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                  </div>
                  <div class="overflow-y-auto p-6">
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 mb-5">
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('provider')"></p><p class="text-sm font-medium text-slate-700" x-text="logDetail.provider"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('model')"></p><p class="text-sm font-mono text-slate-700 truncate" x-text="logDetail.model || '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('status')"></p><p class="text-sm font-medium" :class="logDetail.status === 'success' ? 'text-emerald-600' : 'text-red-500'" x-text="logDetail.status"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('duration')"></p><p class="text-sm text-slate-700" x-text="logDetail.duration_ms != null ? logDetail.duration_ms + 'ms' : '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('is_stream')"></p><p class="text-sm text-slate-700" x-text="logDetail.is_stream ? t('yes') : t('no')"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('status_code')"></p><p class="text-sm text-slate-700" x-text="logDetail.response_status ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('prompt_token')"></p><p class="text-sm text-blue-600 font-medium" x-text="logDetail.prompt_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('completion_token')"></p><p class="text-sm text-emerald-600 font-medium" x-text="logDetail.completion_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('cached_token')"></p><p class="text-sm text-amber-600 font-medium" x-text="logDetail.cached_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('total_token')"></p><p class="text-sm text-slate-700 font-medium" x-text="logDetail.total_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2">
                        <p class="text-xs text-slate-400" x-text="t('consume_credit')"></p>
                        <div class="flex items-center gap-1.5 mt-0.5">
                          <p class="text-sm text-indigo-600 font-medium" x-text="logDetail.credit_cost ? Number(logDetail.credit_cost).toFixed(4) : '-'"></p>
                          <span x-show="logDetail.is_long_context" class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-orange-100 text-orange-700" x-text="t('long_ctx_tag')"></span>
                        </div>
                      </div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400" x-text="t('time')"></p><p class="text-sm text-slate-700" x-text="fmtTime(logDetail.created_at)"></p></div>
                    </div>
                    <template x-if="logDetail.error_message">
                      <div class="mb-4">
                        <p class="text-xs text-red-500 font-medium mb-1" x-text="t('error_msg')"></p>
                        <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700" x-text="logDetail.error_message"></div>
                      </div>
                    </template>
                    <div class="mb-4">
                      <p class="text-xs text-slate-500 font-medium mb-1.5" x-text="t('req_body')"></p>
                      <pre class="bg-slate-900 text-slate-300 rounded-lg p-4 text-xs overflow-x-auto max-h-60 leading-relaxed whitespace-pre-wrap break-all" x-text="logDetail.request_body ? JSON.stringify(logDetail.request_body, null, 2) : t('none')"></pre>
                    </div>
                    <div>
                      <p class="text-xs text-slate-500 font-medium mb-1.5" x-text="t('resp_body')"></p>
                      <pre class="bg-slate-900 text-slate-300 rounded-lg p-4 text-xs overflow-x-auto max-h-60 leading-relaxed whitespace-pre-wrap break-all" x-text="logDetail.response_body ? JSON.stringify(logDetail.response_body, null, 2) : t('none')"></pre>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </template>
        </div>

        <!-- ==================== 用量统计 Tab ==================== -->
        <div x-show="tab === 'usage'" x-transition class="anim-fade-in-up" x-data="usageTab()" x-init="load()">
          <!-- 顶部工具栏：组织筛选 + 视角切换 + 天数切换 -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <h2 class="text-lg font-semibold text-slate-800" x-text="t('usage')"></h2>
            <div class="flex flex-wrap items-center gap-3">
              <!-- 组织筛选 -->
              <select x-model="filter.org_id" @change="onOrgChange()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                <option value="" x-text="t('all_usage')"></option>
                <template x-for="o in orgs" :key="o.id"><option :value="o.id" x-text="o.name"></option></template>
              </select>
              <!-- 选择组织后显示 Key 筛选 -->
              <select x-show="filter.org_id" x-model="filter.api_key_id" @change="load()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                <option value="" x-text="t('all_keys')"></option>
                <template x-for="k in orgKeys" :key="k.id"><option :value="k.id" x-text="k.name + ' (' + k.key_prefix + '…)'"></option></template>
              </select>
              <!-- 模型名称模糊搜索 -->
              <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.3-4.3"/></svg>
                <input x-model="filter.model" @input="onModelInput()" type="text"
                  class="pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition w-44"
                  :placeholder="t('model_search_ph')">
              </div>
              <!-- Token / Credit 视角切换 -->
              <div class="flex bg-white border border-slate-200 rounded-lg p-0.5">
                <button @click="perspective = 'token'"
                  :class="perspective === 'token' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="t('perspective_token')">
                </button>
                <button @click="perspective = 'credit'"
                  :class="perspective === 'credit' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="t('perspective_credit')">
                </button>
              </div>
              <!-- 天数切换 + 自定义 -->
              <div class="flex bg-white border border-slate-200 rounded-lg p-0.5">
                <template x-for="d in [7, 14, 30]" :key="d">
                  <button @click="useCustomRange = false; days = d; load()"
                    :class="!useCustomRange && days === d ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                    class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="t('days', d)">
                  </button>
                </template>
                <button @click="useCustomRange = true"
                  :class="useCustomRange ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="t('custom_range')">
                </button>
              </div>
              <!-- 自定义时间范围 -->
              <div x-show="useCustomRange" class="flex items-center gap-1.5 relative">
                <button @click="_drp_open('usageStart', customRange.start)" class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs hover:bg-slate-100 transition min-w-[100px] text-left" x-text="_drp_fmtDisplay(customRange.start)"></button>
                <span class="text-slate-400 text-xs">-</span>
                <button @click="_drp_open('usageEnd', customRange.end)" class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs hover:bg-slate-100 transition min-w-[100px] text-left" x-text="_drp_fmtDisplay(customRange.end)"></button>
                <!-- 日历面板 -->
                <div x-show="_drp_showPanel === 'usageStart' || _drp_showPanel === 'usageEnd'" @click.away="_drp_showPanel = ''"
                  class="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg p-3 z-50 w-64">
                  <div class="flex items-center justify-between mb-2">
                    <button @click="_drp_prevMonth()" class="p-1 hover:bg-slate-100 rounded text-slate-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
                    <span class="text-sm font-medium text-slate-700" x-text="_drp_monthLabel"></span>
                    <button @click="_drp_nextMonth()" class="p-1 hover:bg-slate-100 rounded text-slate-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
                  </div>
                  <div class="grid grid-cols-7 gap-0.5 text-center text-[10px] text-slate-400 mb-1">
                    <template x-for="wd in _drp_weekDays"><span x-text="wd"></span></template>
                  </div>
                  <div class="grid grid-cols-7 gap-0.5 text-center">
                    <template x-for="(cell, ci) in _drp_days" :key="ci">
                      <button @click="_drp_showPanel === 'usageStart' ? selectCustomStart(cell) : selectCustomEnd(cell)"
                        :class="[cell.cur ? 'text-slate-700 hover:bg-indigo-50 hover:text-indigo-600' : 'text-slate-300 pointer-events-none', _drp_isToday(cell) && 'bg-indigo-500 text-white hover:bg-indigo-600 hover:text-white rounded-full']"
                        class="w-8 h-8 text-xs rounded-full transition" x-text="cell.d"></button>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading && stats">
            <div class="space-y-6">
              <!-- 概览卡片 -->
              <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 anim-fade-in-up">
                <div class="bg-gradient-to-br from-blue-50 to-white border border-blue-100/60 rounded-xl p-4">
                  <p class="text-xs text-blue-500/80 font-medium" x-text="t('total_req')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.total_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-emerald-50 to-white border border-emerald-100/60 rounded-xl p-4">
                  <p class="text-xs text-emerald-500/80 font-medium" x-text="t('success')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.success_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-white border border-red-100/60 rounded-xl p-4">
                  <p class="text-xs text-red-400/80 font-medium" x-text="t('error')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.error_requests)"></p>
                </div>
                <!-- Token 视角：显示总 Token；Credit 视角：显示总 Credit -->
                <template x-if="perspective === 'token'">
                  <div class="bg-gradient-to-br from-violet-50 to-white border border-violet-100/60 rounded-xl p-4">
                    <p class="text-xs text-violet-500/80 font-medium" x-text="t('total_token')"></p>
                    <p class="text-2xl font-bold text-slate-800 mt-1" x-text="fmtToken(stats.overview.total_tokens)"></p>
                    <p class="text-[10px] text-slate-500 mt-1">
                      <span x-text="t('in')"></span><span x-text="fmtToken(stats.overview.prompt_tokens)"></span> · 
                      <span x-text="t('out')"></span><span x-text="fmtToken(stats.overview.completion_tokens)"></span> · 
                      <span x-text="t('cache')"></span><span x-text="fmtToken(stats.overview.cached_tokens)"></span>
                    </p>
                  </div>
                </template>
                <template x-if="perspective === 'credit'">
                  <div class="bg-gradient-to-br from-indigo-50 to-white border border-indigo-100/60 rounded-xl p-4">
                    <p class="text-xs text-indigo-500/80 font-medium" x-text="t('total_credit_cost')"></p>
                    <p class="text-2xl font-bold text-indigo-700 mt-1" x-text="Number(stats.overview.total_credit_cost || 0).toFixed(4)"></p>
                  </div>
                </template>
                <div class="bg-gradient-to-br from-amber-50 to-white border border-amber-100/60 rounded-xl p-4">
                  <p class="text-xs text-amber-500/80 font-medium" x-text="t('avg_time')"></p>
                  <p class="text-2xl font-bold text-slate-800 mt-1"><span x-text="Math.round(stats.overview.avg_duration_ms)"></span><span class="text-sm font-normal text-slate-400">ms</span></p>
                </div>
              </div>

              <!-- 每日请求数柱状图 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-5 anim-fade-in-up">
                <h3 class="text-sm font-semibold text-slate-700 mb-4" x-text="t('daily_req')"></h3>
                <div class="flex items-end gap-1.5" style="height: 180px;" x-show="stats.daily_stats.length > 0">
                  <template x-for="(d, i) in stats.daily_stats" :key="d.date">
                    <div class="flex-1 flex flex-col items-center group relative">
                      <div class="absolute bottom-full mb-2 hidden group-hover:block z-10">
                        <div class="bg-slate-800 text-white text-xs rounded-lg px-3 py-1.5 whitespace-nowrap shadow-lg">
                          <span x-text="d.date"></span>: <span x-text="formatNum(d.request_count)"></span>
                        </div>
                      </div>
                      <div class="w-full rounded-t-md bg-gradient-to-t from-blue-500 to-violet-400 transition-all duration-300 hover:from-blue-600 hover:to-violet-500 min-h-[4px]"
                        :style="'height: ' + (maxReq > 0 ? Math.max(d.request_count / maxReq * 160, 4) : 4) + 'px'">
                      </div>
                      <span class="text-[10px] text-slate-400 mt-1.5 whitespace-nowrap" x-show="stats.daily_stats.length <= 10 || i % Math.ceil(stats.daily_stats.length / 10) === 0" x-text="d.date.slice(5)"></span>
                    </div>
                  </template>
                </div>
                <template x-if="stats.daily_stats.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
              </div>

              <!-- Token 视角：每日 Token 消耗柱状图 -->
              <div x-show="perspective === 'token'" class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-5 anim-fade-in-up anim-delay-1">
                <h3 class="text-sm font-semibold text-slate-700 mb-4" x-text="t('daily_token')"></h3>
                <div class="flex items-end gap-1.5" style="height: 180px;" x-show="stats.daily_stats.length > 0">
                  <template x-for="(d, i) in stats.daily_stats" :key="d.date">
                    <div class="flex-1 flex flex-col items-center group relative">
                      <div class="absolute bottom-full mb-2 hidden group-hover:block z-10">
                        <div class="bg-slate-800 text-white text-xs rounded-lg px-3 py-1.5 whitespace-nowrap shadow-lg">
                          <span x-text="d.date"></span>: <span x-text="fmtToken(d.total_tokens)"></span> Token
                          <div class="text-[10px] text-slate-300 mt-1">
                            <span x-text="t('in')"></span> <span x-text="fmtToken(d.prompt_tokens)"></span> · 
                            <span x-text="t('out')"></span> <span x-text="fmtToken(d.completion_tokens)"></span> · 
                            <span x-text="t('cache')"></span> <span x-text="fmtToken(d.cached_tokens)"></span>
                          </div>
                        </div>
                      </div>
                      <div class="w-full rounded-t-md bg-gradient-to-t from-emerald-500 to-teal-400 transition-all duration-300 hover:from-emerald-600 hover:to-teal-500 min-h-[4px]"
                        :style="'height: ' + (maxToken > 0 ? Math.max(d.total_tokens / maxToken * 160, 4) : 4) + 'px'">
                      </div>
                      <span class="text-[10px] text-slate-400 mt-1.5 whitespace-nowrap" x-show="stats.daily_stats.length <= 10 || i % Math.ceil(stats.daily_stats.length / 10) === 0" x-text="d.date.slice(5)"></span>
                    </div>
                  </template>
                </div>
                <template x-if="stats.daily_stats.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
              </div>

              <!-- Credit 视角：每日 Credit 消耗柱状图 -->
              <div x-show="perspective === 'credit'" class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-5 anim-fade-in-up anim-delay-1">
                <h3 class="text-sm font-semibold text-slate-700 mb-4" x-text="t('daily_credit')"></h3>
                <div class="flex items-end gap-1.5" style="height: 180px;" x-show="stats.daily_stats.length > 0">
                  <template x-for="(d, i) in stats.daily_stats" :key="d.date">
                    <div class="flex-1 flex flex-col items-center group relative">
                      <div class="absolute bottom-full mb-2 hidden group-hover:block z-10">
                        <div class="bg-slate-800 text-white text-xs rounded-lg px-3 py-1.5 whitespace-nowrap shadow-lg">
                          <span x-text="d.date"></span>: <span x-text="Number(d.credit_cost || 0).toFixed(4)"></span> Credit
                        </div>
                      </div>
                      <div class="w-full rounded-t-md bg-gradient-to-t from-indigo-500 to-purple-400 transition-all duration-300 hover:from-indigo-600 hover:to-purple-500 min-h-[4px]"
                        :style="'height: ' + (maxCredit > 0 ? Math.max((d.credit_cost || 0) / maxCredit * 160, 4) : 4) + 'px'">
                      </div>
                      <span class="text-[10px] text-slate-400 mt-1.5 whitespace-nowrap" x-show="stats.daily_stats.length <= 10 || i % Math.ceil(stats.daily_stats.length / 10) === 0" x-text="d.date.slice(5)"></span>
                    </div>
                  </template>
                </div>
                <template x-if="stats.daily_stats.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
              </div>

              <!-- 模型使用排行 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-2">
                <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700" x-text="t('model_ranking')"></h3></div>
                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead>
                      <tr class="text-xs text-slate-400 border-b border-slate-100">
                        <th class="text-left px-5 py-2.5 font-medium" x-text="t('ranking')"></th>
                        <th class="text-left px-5 py-2.5 font-medium" x-text="t('model')"></th>
                        <th class="text-right px-5 py-2.5 font-medium" x-text="t('req_count')"></th>
                        <th class="text-right px-5 py-2.5 font-medium" x-show="perspective === 'token'">Token</th>
                        <th class="text-right px-5 py-2.5 font-medium" x-show="perspective === 'credit'" x-text="t('credit_cost')"></th>
                        <th class="text-right px-5 py-2.5 font-medium" x-text="t('avg_time')"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(m, i) in stats.by_model" :key="m.model">
                        <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                          <td class="px-5 py-2.5">
                            <span x-show="i === 0" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold bg-amber-100 text-amber-700">1</span>
                            <span x-show="i === 1" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold bg-slate-200 text-slate-600">2</span>
                            <span x-show="i === 2" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold bg-orange-100 text-orange-600">3</span>
                            <span x-show="i > 2" class="text-sm text-slate-400 pl-1.5" x-text="i + 1"></span>
                          </td>
                          <td class="px-5 py-2.5 font-mono text-xs text-slate-700" x-text="m.model"></td>
                          <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(m.request_count)"></td>
                          <!-- Token 视角列 -->
                          <td class="px-5 py-2.5 text-right text-slate-600" x-show="perspective === 'token'">
                            <div x-text="fmtToken(m.total_tokens)"></div>
                            <div class="text-[10px] text-slate-400 mt-0.5"><span x-text="t('in')"></span><span x-text="fmtToken(m.prompt_tokens)"></span> · <span x-text="t('out')"></span><span x-text="fmtToken(m.completion_tokens)"></span> · <span x-text="t('cache')"></span><span x-text="fmtToken(m.cached_tokens)"></span></div>
                          </td>
                          <!-- Credit 视角列 -->
                          <td class="px-5 py-2.5 text-right text-indigo-600 font-medium" x-show="perspective === 'credit'" x-text="Number(m.total_credit_cost || 0).toFixed(4)"></td>
                          <td class="px-5 py-2.5 text-right text-slate-500"><span x-text="Math.round(m.avg_duration_ms)"></span>ms</td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <template x-if="stats.by_model.length === 0"><p class="text-center text-slate-400 text-sm py-8" x-text="t('no_data')"></p></template>
                </div>
              </div>
            </div>
          </template>
        </div>
        
        <!-- ==================== 系统设置 Tab ==================== -->
        <div x-show="tab === 'settings'" x-transition class="anim-fade-in-up" x-data="settingsTab()" x-init="load()">
          <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-6 max-w-2xl">
            <h3 class="text-base font-semibold text-slate-800 mb-6" x-text="t('credit_rate_setting')"></h3>
            <p class="text-xs text-slate-500 mb-6" x-text="t('credit_rate_desc')"></p>
            
            <div class="space-y-4">
              <div>
                <label class="block text-sm text-slate-600 mb-1.5" x-text="t('input_rate')"></label>
                <div class="flex items-center gap-2">
                  <input x-model.number="rates.input_rate" type="number" step="0.01" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                  <span class="text-sm text-slate-400 whitespace-nowrap">Tokens / Credit</span>
                </div>
              </div>
              <div>
                <label class="block text-sm text-slate-600 mb-1.5" x-text="t('output_rate')"></label>
                <div class="flex items-center gap-2">
                  <input x-model.number="rates.output_rate" type="number" step="0.01" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                  <span class="text-sm text-slate-400 whitespace-nowrap">Tokens / Credit</span>
                </div>
              </div>
              <div>
                <label class="block text-sm text-slate-600 mb-1.5" x-text="t('cached_rate')"></label>
                <div class="flex items-center gap-2">
                  <input x-model.number="rates.cached_rate" type="number" step="0.01" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                  <span class="text-sm text-slate-400 whitespace-nowrap">Tokens / Credit</span>
                </div>
              </div>

              <!-- 长上下文倍率配置 -->
              <div class="pt-4 mt-2 border-t border-slate-100">
                <h4 class="text-sm font-medium text-slate-700 mb-1" x-text="t('long_context_title')"></h4>
                <p class="text-xs text-slate-400 mb-4" x-text="t('long_context_desc')"></p>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm text-slate-600 mb-1.5" x-text="t('long_context_threshold')"></label>
                    <div class="flex items-center gap-2">
                      <input x-model.number="rates.long_context_threshold" type="number" step="1" min="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="0">
                      <span class="text-sm text-slate-400 whitespace-nowrap">Tokens</span>
                    </div>
                  </div>
                  <div>
                    <label class="block text-sm text-slate-600 mb-1.5" x-text="t('long_context_multiplier')"></label>
                    <div class="flex items-center gap-2">
                      <input x-model.number="rates.long_context_multiplier" type="number" step="0.1" min="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="0">
                      <span class="text-sm text-slate-400 whitespace-nowrap">x</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button @click="save()" class="px-5 py-2 text-sm bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition shadow-sm" x-text="t('save_settings')"></button>
              </div>
            </div>
          </div>

          <!-- 修改密码 -->
          <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-6 max-w-2xl mt-6">
            <h3 class="text-base font-semibold text-slate-800 mb-6" x-text="t('change_pwd')"></h3>
            <div class="space-y-4">
              <div>
                <label class="block text-sm text-slate-600 mb-1.5" x-text="t('old_pwd')"></label>
                <div class="relative">
                  <input x-model="pwdForm.old_password" :type="showOldPwd ? 'text' : 'password'" class="w-full px-3 py-2 pr-10 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                  <button type="button" @click="showOldPwd = !showOldPwd" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                    <svg x-show="!showOldPwd" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <svg x-show="showOldPwd" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
                  </button>
                </div>
              </div>
              <div>
                <label class="block text-sm text-slate-600 mb-1.5" x-text="t('new_pwd')"></label>
                <div class="relative">
                  <input x-model="pwdForm.new_password" :type="showNewPwd ? 'text' : 'password'" class="w-full px-3 py-2 pr-10 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                  <button type="button" @click="showNewPwd = !showNewPwd" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                    <svg x-show="!showNewPwd" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <svg x-show="showNewPwd" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
                  </button>
                </div>
              </div>
              <div>
                <label class="block text-sm text-slate-600 mb-1.5" x-text="t('confirm_pwd')"></label>
                <div class="relative">
                  <input x-model="pwdForm.confirm_password" :type="showConfirmPwd ? 'text' : 'password'" class="w-full px-3 py-2 pr-10 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                  <button type="button" @click="showConfirmPwd = !showConfirmPwd" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                    <svg x-show="!showConfirmPwd" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <svg x-show="showConfirmPwd" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
                  </button>
                </div>
              </div>
              <div class="pt-4 border-t border-slate-100 flex justify-end">
                <button @click="changePassword()" class="px-5 py-2 text-sm bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition shadow-sm" x-text="t('change_pwd')"></button>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </template>
</div>

<!-- JS 模块（i18n 必须最先加载，其次 utils，最后各业务组件） -->
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/overview.js"></script>
<script src="js/orgs.js"></script>
<script src="js/logs.js"></script>
<script src="js/usage.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
