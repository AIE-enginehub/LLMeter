<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gongs-credit 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .anim-fade-in-up { animation: fadeInUp 0.4s ease-out both; }
    .anim-fade-in { animation: fadeIn 0.3s ease-out both; }
    .anim-slide-in { animation: slideIn 0.3s ease-out both; }
    .anim-delay-1 { animation-delay: 0.05s; }
    .anim-delay-2 { animation-delay: 0.1s; }
    .anim-delay-3 { animation-delay: 0.15s; }
    .anim-delay-4 { animation-delay: 0.2s; }
    .anim-delay-5 { animation-delay: 0.25s; }
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans SC"', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50/50 min-h-screen font-sans text-slate-700">

<!-- ========== 全局应用状态 ========== -->
<div x-data="app()" x-cloak class="min-h-screen">

  <!-- ==================== 登录页 ==================== -->
  <template x-if="!user">
    <div class="min-h-screen flex items-center justify-center relative overflow-hidden">
      <!-- 背景装饰 -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-100 via-blue-50/50 to-violet-50/50"></div>
      <div class="absolute top-20 left-20 w-72 h-72 bg-blue-100/40 rounded-full blur-3xl"></div>
      <div class="absolute bottom-20 right-20 w-96 h-96 bg-violet-100/40 rounded-full blur-3xl"></div>

      <!-- 登录卡片 -->
      <div class="relative z-10 w-full max-w-sm anim-fade-in-up">
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-200/60 p-8">
          <!-- Logo -->
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-slate-700 to-slate-900 rounded-xl mb-4 shadow-lg shadow-slate-300/50">
              <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">gongs-credit</h1>
            <p class="text-sm text-slate-400 mt-1">API 网关管理后台</p>
          </div>

          <!-- 表单 -->
          <form @submit.prevent="login()">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5">用户名</label>
                <input x-model="loginForm.username" type="text" required
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition"
                  placeholder="请输入用户名">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1.5">密码</label>
                <input x-model="loginForm.password" type="password" required
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition"
                  placeholder="请输入密码">
              </div>
            </div>
            <template x-if="loginError">
              <p class="mt-3 text-sm text-red-500 anim-fade-in" x-text="loginError"></p>
            </template>
            <button type="submit" :disabled="loginLoading"
              class="mt-6 w-full py-2.5 bg-gradient-to-r from-slate-700 to-slate-800 text-white text-sm font-medium rounded-lg hover:from-slate-800 hover:to-slate-900 transition-all disabled:opacity-60 shadow-sm">
              <span x-show="!loginLoading">登 录</span>
              <span x-show="loginLoading" class="inline-flex items-center gap-2">
                <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                登录中…
              </span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== 管理页面（登录后） ==================== -->
  <template x-if="user">
    <div class="min-h-screen anim-fade-in">
      <!-- 顶部导航栏 -->
      <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-slate-200/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
          <!-- Logo + 导航 -->
          <div class="flex items-center gap-8">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 bg-gradient-to-br from-slate-700 to-slate-900 rounded-lg flex items-center justify-center shadow-sm">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
              </div>
              <span class="font-bold text-slate-800 text-sm hidden sm:block">gongs-credit</span>
            </div>
            <div class="flex gap-1">
              <template x-for="t in tabs" :key="t.key">
                <button @click="tab = t.key"
                  :class="tab === t.key ? 'bg-slate-100 text-slate-800 font-medium' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'"
                  class="px-3 py-1.5 rounded-lg text-sm transition-all" x-text="t.label">
                </button>
              </template>
            </div>
          </div>
          <!-- 用户 + 退出 -->
          <div class="flex items-center gap-3">
            <span class="text-xs text-slate-400" x-text="user.username"></span>
            <button @click="logout()" class="text-xs text-slate-400 hover:text-red-500 transition px-2 py-1 rounded hover:bg-red-50">退出</button>
          </div>
        </div>
      </nav>

      <!-- 内容区域 -->
      <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

        <!-- ==================== 概览 Tab ==================== -->
        <div x-show="tab === 'overview'" x-transition class="anim-fade-in-up" x-data="overviewTab()" x-init="load()">
          <!-- 天数切换 -->
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold text-slate-800">数据概览</h2>
            <div class="flex bg-white border border-slate-200 rounded-lg p-0.5">
              <template x-for="d in [7, 14, 30]" :key="d">
                <button @click="days = d; load()"
                  :class="days === d ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="d + '天'">
                </button>
              </template>
            </div>
          </div>

          <!-- 加载中 -->
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading && stats">
            <div>
              <!-- 统计卡片 -->
              <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                <div class="bg-gradient-to-br from-blue-50 to-white border border-blue-100/60 rounded-xl p-4 anim-fade-in-up">
                  <p class="text-xs text-blue-500/80 font-medium">总请求</p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.total_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-emerald-50 to-white border border-emerald-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-1">
                  <p class="text-xs text-emerald-500/80 font-medium">成功</p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.success_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-white border border-red-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-2">
                  <p class="text-xs text-red-400/80 font-medium">错误</p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="formatNum(stats.overview.error_requests)"></p>
                </div>
                <div class="bg-gradient-to-br from-violet-50 to-white border border-violet-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-3">
                  <p class="text-xs text-violet-500/80 font-medium">总 Token</p>
                  <p class="text-2xl font-bold text-slate-800 mt-1" x-text="fmtToken(stats.overview.total_tokens)"></p>
                </div>
                <div class="bg-gradient-to-br from-amber-50 to-white border border-amber-100/60 rounded-xl p-4 anim-fade-in-up anim-delay-4">
                  <p class="text-xs text-amber-500/80 font-medium">平均耗时</p>
                  <p class="text-2xl font-bold text-slate-800 mt-1"><span x-text="Math.round(stats.overview.avg_duration_ms)"></span><span class="text-sm font-normal text-slate-400">ms</span></p>
                </div>
              </div>

              <!-- 按服务商 / 模型统计 -->
              <div class="grid lg:grid-cols-2 gap-6">
                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-3">
                  <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700">按服务商</h3></div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium">服务商</th><th class="text-right px-5 py-2.5 font-medium">请求数</th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium">错误</th></tr></thead>
                      <tbody>
                        <template x-for="p in stats.by_provider" :key="p.provider">
                          <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                            <td class="px-5 py-2.5 font-medium text-slate-700" x-text="p.provider"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(p.request_count)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="fmtToken(p.total_tokens)"></td>
                            <td class="px-5 py-2.5 text-right"><span :class="p.error_count > 0 ? 'text-red-500' : 'text-slate-400'" x-text="p.error_count"></span></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="stats.by_provider.length === 0"><p class="text-center text-slate-400 text-sm py-8">暂无数据</p></template>
                  </div>
                </div>

                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-4">
                  <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700">按模型</h3></div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                      <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium">模型</th><th class="text-right px-5 py-2.5 font-medium">请求数</th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium">平均耗时</th></tr></thead>
                      <tbody>
                        <template x-for="m in stats.by_model" :key="m.model">
                          <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                            <td class="px-5 py-2.5 font-mono text-xs text-slate-700" x-text="m.model"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(m.request_count)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-600" x-text="fmtToken(m.total_tokens)"></td>
                            <td class="px-5 py-2.5 text-right text-slate-500"><span x-text="Math.round(m.avg_duration_ms)"></span>ms</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="stats.by_model.length === 0"><p class="text-center text-slate-400 text-sm py-8">暂无数据</p></template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- ==================== 组织管理 Tab ==================== -->
        <div x-show="tab === 'orgs'" x-transition class="anim-fade-in-up" x-data="orgsTab()" x-init="load()">
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading">
            <div class="flex gap-6" style="min-height: calc(100vh - 140px);">
              <!-- 左侧组织列表 -->
              <div class="w-64 flex-shrink-0">
                <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                  <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-700">组织列表</h3>
                    <button @click="showCreateOrg = true" class="text-xs px-2.5 py-1 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition">新建</button>
                  </div>
                  <div class="p-2 max-h-[60vh] overflow-y-auto">
                    <template x-for="org in orgs" :key="org.id">
                      <button @click="selectOrg(org)"
                        :class="selectedOrg && selectedOrg.id === org.id ? 'bg-slate-100 text-slate-800' : 'text-slate-600 hover:bg-slate-50'"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm transition flex items-center justify-between group">
                        <span class="truncate" x-text="org.name"></span>
                        <span :class="org.is_active ? 'bg-emerald-400' : 'bg-slate-300'" class="w-1.5 h-1.5 rounded-full flex-shrink-0"></span>
                      </button>
                    </template>
                    <template x-if="orgs.length === 0"><p class="text-center text-slate-400 text-xs py-4">暂无组织</p></template>
                  </div>
                </div>
              </div>

              <!-- 右侧详情 -->
              <div class="flex-1 min-w-0">
                <template x-if="!selectedOrg">
                  <div class="flex items-center justify-center h-64 text-slate-400 text-sm">选择左侧组织查看详情</div>
                </template>

                <template x-if="selectedOrg">
                  <div class="space-y-6 anim-fade-in-up">
                    <!-- 组织信息 -->
                    <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-slate-700">组织信息</h3>
                        <div class="flex gap-2">
                          <button @click="saveOrg()" class="text-xs px-3 py-1.5 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition">保存</button>
                          <button @click="deleteOrg()" class="text-xs px-3 py-1.5 text-red-500 border border-red-200 rounded-md hover:bg-red-50 transition">删除</button>
                        </div>
                      </div>
                      <div class="p-5 grid grid-cols-3 gap-4">
                        <div>
                          <label class="block text-xs text-slate-400 mb-1">名称</label>
                          <input x-model="editOrg.name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                        </div>
                        <div>
                          <label class="block text-xs text-slate-400 mb-1">标识（slug）</label>
                          <input x-model="editOrg.slug" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                        </div>
                        <div>
                          <label class="block text-xs text-slate-400 mb-1">状态</label>
                          <select x-model="editOrg.is_active" @change="editOrg.is_active = ($event.target.value === 'true')" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                            <option value="true" :selected="editOrg.is_active === true">启用</option>
                            <option value="false" :selected="editOrg.is_active === false">禁用</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <!-- API Key 管理 -->
                    <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-slate-700">API Key</h3>
                        <button @click="showCreateKey = true" class="text-xs px-2.5 py-1 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition">创建 Key</button>
                      </div>
                      <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                          <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium">名称</th><th class="text-left px-5 py-2.5 font-medium">前缀</th><th class="text-left px-5 py-2.5 font-medium">状态</th><th class="text-left px-5 py-2.5 font-medium">创建时间</th><th class="text-right px-5 py-2.5 font-medium">操作</th></tr></thead>
                          <tbody>
                            <template x-for="k in keys" :key="k.id">
                              <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                                <td class="px-5 py-2.5 text-slate-700" x-text="k.name"></td>
                                <td class="px-5 py-2.5 font-mono text-xs text-slate-500" x-text="k.key_prefix + '...'"></td>
                                <td class="px-5 py-2.5"><span :class="k.is_active ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400 bg-slate-100'" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"><span :class="k.is_active ? 'bg-emerald-400' : 'bg-slate-300'" class="w-1.5 h-1.5 rounded-full"></span><span x-text="k.is_active ? '启用' : '禁用'"></span></span></td>
                                <td class="px-5 py-2.5 text-xs text-slate-400" x-text="fmtTime(k.created_at)"></td>
                                <td class="px-5 py-2.5 text-right"><button @click="deleteKey(k.id)" class="text-xs text-red-400 hover:text-red-600 transition">删除</button></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                        <template x-if="keys.length === 0"><p class="text-center text-slate-400 text-sm py-6">暂无 Key</p></template>
                      </div>
                    </div>

                    <!-- 模型配置管理 -->
                    <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm">
                      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-slate-700">模型配置</h3>
                        <button @click="openModelForm()" class="text-xs px-2.5 py-1 bg-slate-800 text-white rounded-md hover:bg-slate-700 transition">添加配置</button>
                      </div>
                      <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                          <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium">名称</th><th class="text-left px-5 py-2.5 font-medium">协议</th><th class="text-left px-5 py-2.5 font-medium">模型标识</th><th class="text-left px-5 py-2.5 font-medium">优先级</th><th class="text-left px-5 py-2.5 font-medium">状态</th><th class="text-right px-5 py-2.5 font-medium">操作</th></tr></thead>
                          <tbody>
                            <template x-for="m in models" :key="m.id">
                              <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                                <td class="px-5 py-2.5 text-slate-700" x-text="m.name"></td>
                                <td class="px-5 py-2.5"><span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-mono" x-text="m.protocol"></span></td>
                                <td class="px-5 py-2.5 font-mono text-xs max-w-[200px] truncate" :class="m.model_patterns ? 'text-slate-500' : 'text-slate-300 italic'" x-text="m.model_patterns || '(按名称前缀匹配)'"></td>
                                <td class="px-5 py-2.5 text-slate-600" x-text="m.priority"></td>
                                <td class="px-5 py-2.5"><span :class="m.is_active ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400 bg-slate-100'" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"><span :class="m.is_active ? 'bg-emerald-400' : 'bg-slate-300'" class="w-1.5 h-1.5 rounded-full"></span><span x-text="m.is_active ? '启用' : '禁用'"></span></span></td>
                                <td class="px-5 py-2.5 text-right">
                                  <button @click="openModelForm(m)" class="text-xs text-slate-500 hover:text-slate-700 mr-2 transition">编辑</button>
                                  <button @click="deleteModel(m.id)" class="text-xs text-red-400 hover:text-red-600 transition">删除</button>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                        <template x-if="models.length === 0"><p class="text-center text-slate-400 text-sm py-6">暂无配置</p></template>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- 创建组织弹窗 -->
          <template x-if="showCreateOrg">
            <div class="fixed inset-0 z-50 flex items-center justify-center anim-fade-in" @click.self="showCreateOrg = false">
              <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm"></div>
              <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md p-6 anim-slide-in">

                    <label class="block text-xs text-slate-500 mb-1">名称</label>

                </div>
              </div>
            </div>

          <!-- 创建 Key 弹窗 -->

            <div class="fixed inset-0 z-50 flex items-center justify-center anim-fade-in" @click.self="showCreateKey = false">
              <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm"></div>
              <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md p-6 anim-slide-in">

                  <label class="block text-xs text-slate-500 mb-1">Key 名称</label>
                  <input x-model="newKeyName" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="例如：production-key">

                <div class="flex justify-end gap-2 mt-5">
                  <button @click="showCreateKey = false" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 transition">取消</button>

                </div>
              </div>
            </div>
          </template>

          <!-- 显示新 Key 弹窗 -->
          <template x-if="createdKey">
            <div class="fixed inset-0 z-50 flex items-center justify-center anim-fade-in" @click.self="createdKey = null">
              <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm"></div>
              <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-lg p-6 anim-slide-in">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-8 h-8 bg-emerald-100 rounded-full flex items-center justify-center"><svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>
                  <h3 class="text-base font-semibold text-slate-800">Key 创建成功</h3>
                </div>

                  <code class="text-sm text-emerald-400 break-all" x-text="createdKey.key"></code>
                  <button @click="copyText(createdKey.key)" class="flex-shrink-0 text-xs text-slate-400 hover:text-white bg-slate-800 px-2.5 py-1 rounded transition">复制</button>
                </div>
                <div class="flex justify-end mt-4">
                  <button @click="createdKey = null" class="px-4 py-2 text-sm bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition">确认关闭</button>
                </div>
              </div>
            </div>
          </template>

          <!-- 模型配置表单弹窗 -->
          <template x-if="showModelForm">
            <div class="fixed inset-0 z-50 flex items-center justify-center anim-fade-in" @click.self="showModelForm = false">
              <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm"></div>
              <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-lg p-6 anim-slide-in">
                <h3 class="text-base font-semibold text-slate-800 mb-4" x-text="modelForm.id ? '编辑模型配置' : '添加模型配置'"></h3>
                <div class="space-y-3">
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs text-slate-500 mb-1">名称</label>
                      <input x-model="modelForm.name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="配置名称">
                    </div>
                    <div>
                      <label class="block text-xs text-slate-500 mb-1">协议</label>
                      <select x-model="modelForm.protocol" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="gemini">Gemini</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 mb-1">模型标识</label>
                    <input x-model="modelForm.model_patterns" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="gpt-*,o1-* 逗号分隔，支持通配符">
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 mb-1">Base URL</label>
                    <input x-model="modelForm.base_url" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="https://api.openai.com">
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 mb-1">API Key</label>
                    <input x-model="modelForm.real_api_key" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="sk-...">
                  </div>
                  <div>
                    <label class="block text-xs text-slate-500 mb-1">优先级</label>
                    <input x-model.number="modelForm.priority" type="number" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition" placeholder="0">
                  </div>
                </div>
                <div class="flex justify-end gap-2 mt-5">
                  <button @click="showModelForm = false" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 transition">取消</button>
                  <button @click="saveModel()" class="px-4 py-2 text-sm bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition" x-text="modelForm.id ? '保存' : '创建'"></button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- ==================== 调用日志 Tab ==================== -->
        <div x-show="tab === 'logs'" x-transition class="anim-fade-in-up" x-data="logsTab()" x-init="load()">
          <!-- 筛选栏 -->
          <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-4 mb-4 flex flex-wrap items-center gap-3">
            <select x-model="filter.org_id" @change="page = 1; load()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
              <option value="">全部组织</option>
              <template x-for="o in orgs" :key="o.id"><option :value="o.id" x-text="o.name"></option></template>
            </select>
            <select x-model="filter.status" @change="page = 1; load()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 transition">
              <option value="">全部状态</option>
              <option value="success">成功</option>
              <option value="error">错误</option>
              <option value="pending">处理中</option>
            </select>
            <div class="flex-1"></div>
            <span class="text-xs text-slate-400" x-show="total > 0" x-text="'共 ' + total + ' 条记录'"></span>
          </div>

          <!-- 加载中 -->
          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading">
            <div>
              <!-- 日志表格 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead><tr class="text-xs text-slate-400 border-b border-slate-100 bg-slate-50/50"><th class="text-left px-4 py-2.5 font-medium">时间</th><th class="text-left px-4 py-2.5 font-medium">服务商</th><th class="text-left px-4 py-2.5 font-medium">模型</th><th class="text-center px-4 py-2.5 font-medium">SSE</th><th class="text-left px-4 py-2.5 font-medium">状态</th><th class="text-right px-4 py-2.5 font-medium">Token</th><th class="text-right px-4 py-2.5 font-medium">耗时</th></tr></thead>
                    <tbody>
                      <template x-for="log in logs" :key="log.id">
                        <tr @click="viewLog(log.id)" class="border-b border-slate-50 hover:bg-blue-50/50 cursor-pointer transition">
                          <td class="px-4 py-2.5 text-xs text-slate-500 whitespace-nowrap" x-text="fmtTime(log.created_at)"></td>
                          <td class="px-4 py-2.5 text-slate-600" x-text="log.provider"></td>
                          <td class="px-4 py-2.5 font-mono text-xs text-slate-600" x-text="log.model || '-'"></td>
                          <td class="px-4 py-2.5 text-center"><span x-show="log.is_stream" class="text-xs text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded">SSE</span><span x-show="!log.is_stream" class="text-xs text-slate-300">-</span></td>
                          <td class="px-4 py-2.5">
                            <span :class="{
                              'text-emerald-600 bg-emerald-50': log.status === 'success',
                              'text-red-500 bg-red-50': log.status === 'error',
                              'text-amber-600 bg-amber-50': log.status === 'pending'
                            }" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium">
                              <span :class="{
                                'bg-emerald-400': log.status === 'success',
                                'bg-red-400': log.status === 'error',
                                'bg-amber-400': log.status === 'pending'
                              }" class="w-1.5 h-1.5 rounded-full"></span>
                              <span x-text="log.status === 'success' ? '成功' : log.status === 'error' ? '错误' : '处理中'"></span>
                            </span>
                          </td>
                          <td class="px-4 py-2.5 text-right text-xs text-slate-500" x-text="fmtToken(log.total_tokens)"></td>
                          <td class="px-4 py-2.5 text-right text-xs text-slate-500" x-text="log.duration_ms != null ? log.duration_ms + 'ms' : '-'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <template x-if="logs.length === 0"><p class="text-center text-slate-400 text-sm py-10">暂无日志记录</p></template>
                </div>
              </div>

              <!-- 分页 -->
              <div x-show="totalPages > 1" class="flex items-center justify-center gap-2 mt-4">
                <button @click="page = Math.max(1, page - 1); load()" :disabled="page <= 1" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 transition">上一页</button>
                <span class="text-sm text-slate-500" x-text="page + ' / ' + totalPages"></span>
                <button @click="page = Math.min(totalPages, page + 1); load()" :disabled="page >= totalPages" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 transition">下一页</button>
              </div>
            </div>
          </template>

          <!-- 日志详情弹窗（teleport 到 body 避免被 sticky nav 遮挡） -->
          <template x-if="logDetail">
            <template x-teleport="body">
              <div class="fixed inset-0 z-[9999] flex items-center justify-center p-6 anim-fade-in">
                <div class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm" @click="logDetail = null"></div>
                <div class="relative bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-4xl flex flex-col" style="max-height: calc(85vh - 2rem);">
                  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 flex-shrink-0">
                    <div class="flex items-center gap-3">
                      <h3 class="text-base font-semibold text-slate-800">日志详情</h3>
                      <span class="text-xs font-mono text-slate-400 bg-slate-50 px-2 py-0.5 rounded" x-text="logDetail.method + ' ' + logDetail.path"></span>
                    </div>
                    <button @click="logDetail = null" class="text-slate-400 hover:text-slate-600 transition p-1 rounded-lg hover:bg-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                  </div>
                  <div class="overflow-y-auto p-6">
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 mb-5">
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">服务商</p><p class="text-sm font-medium text-slate-700" x-text="logDetail.provider"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">模型</p><p class="text-sm font-mono text-slate-700 truncate" x-text="logDetail.model || '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">状态</p><p class="text-sm font-medium" :class="logDetail.status === 'success' ? 'text-emerald-600' : 'text-red-500'" x-text="logDetail.status"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">耗时</p><p class="text-sm text-slate-700" x-text="logDetail.duration_ms != null ? logDetail.duration_ms + 'ms' : '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">SSE 流式</p><p class="text-sm text-slate-700" x-text="logDetail.is_stream ? '是' : '否'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">HTTP 状态码</p><p class="text-sm text-slate-700" x-text="logDetail.response_status ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">输入 Token</p><p class="text-sm text-blue-600 font-medium" x-text="logDetail.prompt_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">输出 Token</p><p class="text-sm text-emerald-600 font-medium" x-text="logDetail.completion_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">缓存 Token</p><p class="text-sm text-amber-600 font-medium" x-text="logDetail.cached_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">总 Token</p><p class="text-sm text-slate-700 font-medium" x-text="logDetail.total_tokens ?? '-'"></p></div>
                      <div class="bg-slate-50 rounded-lg px-3 py-2"><p class="text-xs text-slate-400">时间</p><p class="text-sm text-slate-700" x-text="fmtTime(logDetail.created_at)"></p></div>
                    </div>
                    <template x-if="logDetail.error_message">
                      <div class="mb-4">
                        <p class="text-xs text-red-500 font-medium mb-1">错误信息</p>
                        <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700" x-text="logDetail.error_message"></div>
                      </div>
                    </template>
                    <div class="mb-4">
                      <p class="text-xs text-slate-500 font-medium mb-1.5">请求体</p>
                      <pre class="bg-slate-900 text-slate-300 rounded-lg p-4 text-xs overflow-x-auto max-h-60 leading-relaxed whitespace-pre-wrap break-all" x-text="logDetail.request_body ? JSON.stringify(logDetail.request_body, null, 2) : '无'"></pre>
                    </div>
                    <div>
                      <p class="text-xs text-slate-500 font-medium mb-1.5">响应体</p>
                      <pre class="bg-slate-900 text-slate-300 rounded-lg p-4 text-xs overflow-x-auto max-h-60 leading-relaxed whitespace-pre-wrap break-all" x-text="logDetail.response_body ? JSON.stringify(logDetail.response_body, null, 2) : '无'"></pre>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </template>
        </div>

        <!-- ==================== 用量统计 Tab ==================== -->
        <div x-show="tab === 'usage'" x-transition class="anim-fade-in-up" x-data="usageTab()" x-init="load()">
          <!-- 天数切换 -->
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold text-slate-800">用量统计</h2>
            <div class="flex bg-white border border-slate-200 rounded-lg p-0.5">
              <template x-for="d in [7, 14, 30]" :key="d">
                <button @click="days = d; load()"
                  :class="days === d ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                  class="px-3 py-1 text-xs rounded-md font-medium transition-all" x-text="d + '天'">
                </button>
              </template>
            </div>
          </div>

          <template x-if="loading">
            <div class="flex justify-center py-20"><div class="w-8 h-8 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div></div>
          </template>

          <template x-if="!loading && stats">
            <div class="space-y-6">
              <!-- 每日请求数柱状图 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-5 anim-fade-in-up">
                <h3 class="text-sm font-semibold text-slate-700 mb-4">每日请求数</h3>
                <div class="flex items-end gap-1.5" style="height: 180px;" x-show="stats.daily_stats.length > 0">
                  <template x-for="(d, i) in stats.daily_stats" :key="d.date">
                    <div class="flex-1 flex flex-col items-center group relative">
                      <!-- Tooltip -->
                      <div class="absolute bottom-full mb-2 hidden group-hover:block z-10">
                        <div class="bg-slate-800 text-white text-xs rounded-lg px-3 py-1.5 whitespace-nowrap shadow-lg">
                          <span x-text="d.date"></span>：<span x-text="formatNum(d.request_count)"></span> 次
                        </div>
                      </div>
                      <!-- 柱子 -->
                      <div class="w-full rounded-t-md bg-gradient-to-t from-blue-500 to-violet-400 transition-all duration-300 hover:from-blue-600 hover:to-violet-500 min-h-[4px]"
                        :style="'height: ' + (maxReq > 0 ? Math.max(d.request_count / maxReq * 160, 4) : 4) + 'px'">
                      </div>
                      <!-- 日期标签（间隔显示避免拥挤） -->
                      <span class="text-[10px] text-slate-400 mt-1.5 whitespace-nowrap" x-show="stats.daily_stats.length <= 10 || i % Math.ceil(stats.daily_stats.length / 10) === 0" x-text="d.date.slice(5)"></span>
                    </div>
                  </template>
                </div>
                <template x-if="stats.daily_stats.length === 0"><p class="text-center text-slate-400 text-sm py-8">暂无数据</p></template>
              </div>

              <!-- 每日 Token 消耗柱状图 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm p-5 anim-fade-in-up anim-delay-1">
                <h3 class="text-sm font-semibold text-slate-700 mb-4">每日 Token 消耗</h3>
                <div class="flex items-end gap-1.5" style="height: 180px;" x-show="stats.daily_stats.length > 0">
                  <template x-for="(d, i) in stats.daily_stats" :key="d.date">
                    <div class="flex-1 flex flex-col items-center group relative">
                      <div class="absolute bottom-full mb-2 hidden group-hover:block z-10">
                        <div class="bg-slate-800 text-white text-xs rounded-lg px-3 py-1.5 whitespace-nowrap shadow-lg">
                          <span x-text="d.date"></span>：<span x-text="fmtToken(d.total_tokens)"></span> Token
                        </div>
                      </div>
                      <div class="w-full rounded-t-md bg-gradient-to-t from-emerald-500 to-teal-400 transition-all duration-300 hover:from-emerald-600 hover:to-teal-500 min-h-[4px]"
                        :style="'height: ' + (maxToken > 0 ? Math.max(d.total_tokens / maxToken * 160, 4) : 4) + 'px'">
                      </div>
                      <span class="text-[10px] text-slate-400 mt-1.5 whitespace-nowrap" x-show="stats.daily_stats.length <= 10 || i % Math.ceil(stats.daily_stats.length / 10) === 0" x-text="d.date.slice(5)"></span>
                    </div>
                  </template>
                </div>
                <template x-if="stats.daily_stats.length === 0"><p class="text-center text-slate-400 text-sm py-8">暂无数据</p></template>
              </div>

              <!-- 模型使用排行 -->
              <div class="bg-white border border-slate-200/60 rounded-xl shadow-sm anim-fade-in-up anim-delay-2">
                <div class="px-5 py-4 border-b border-slate-100"><h3 class="text-sm font-semibold text-slate-700">模型使用排行</h3></div>
                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left px-5 py-2.5 font-medium">排名</th><th class="text-left px-5 py-2.5 font-medium">模型</th><th class="text-right px-5 py-2.5 font-medium">请求数</th><th class="text-right px-5 py-2.5 font-medium">Token</th><th class="text-right px-5 py-2.5 font-medium">平均耗时</th></tr></thead>
                    <tbody>
                      <template x-for="(m, i) in stats.by_model" :key="m.model">
                        <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition">
                          <td class="px-5 py-2.5">
                            <span x-show="i === 0" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold bg-amber-100 text-amber-700">1</span>
                            <span x-show="i === 1" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold bg-slate-200 text-slate-600">2</span>
                            <span x-show="i === 2" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold bg-orange-100 text-orange-600">3</span>
                            <span x-show="i > 2" class="text-sm text-slate-400 pl-1.5" x-text="i + 1"></span>
                          </td>
                          <td class="px-5 py-2.5 font-mono text-xs text-slate-700" x-text="m.model"></td>
                          <td class="px-5 py-2.5 text-right text-slate-600" x-text="formatNum(m.request_count)"></td>
                          <td class="px-5 py-2.5 text-right text-slate-600" x-text="fmtToken(m.total_tokens)"></td>
                          <td class="px-5 py-2.5 text-right text-slate-500"><span x-text="Math.round(m.avg_duration_ms)"></span>ms</td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <template x-if="stats.by_model.length === 0"><p class="text-center text-slate-400 text-sm py-8">暂无数据</p></template>
                </div>
              </div>
            </div>
          </template>
        </div>

      </main>
    </div>
  </template>
</div>

<script>
// ============================================================
// 工具函数
// ============================================================

/** Token 格式化：>= 1M 显示 "1.2M"，>= 1K 显示 "1.2K" */
function fmtToken(n) {
  if (n == null) return '-';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

/** 数值格式化（带千分位） */
function formatNum(n) {
  if (n == null) return '-';
  return Number(n).toLocaleString('zh-CN');
}

/** 时间格式化 */
function fmtTime(t) {
  if (!t) return '-';
  return new Date(t).toLocaleString('zh-CN');
}

/** 复制文本到剪贴板 */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); } catch {}
}

/** 封装 fetch 请求 */
async function api(url, options = {}) {
  const res = await fetch(url, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
  if (res.status === 204) return null;
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `请求失败 (${res.status})`);
  }
  return res.json();
}

// ============================================================
// 全局应用状态
// ============================================================
function app() {
  return {
    user: null,
    tab: 'overview',
    tabs: [
      { key: 'overview', label: '概览' },
      { key: 'orgs', label: '组织管理' },
      { key: 'logs', label: '调用日志' },
      { key: 'usage', label: '用量统计' },
    ],
    loginForm: { username: '', password: '' },
    loginLoading: false,
    loginError: '',

    async init() {
      try {
        this.user = await api('/api/auth/me');
      } catch {
        this.user = null;
      }
    },

    async login() {
      this.loginLoading = true;
      this.loginError = '';
      try {
        const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify(this.loginForm) });
        this.user = res.user;
      } catch (e) {
        this.loginError = e.message;
      } finally {
        this.loginLoading = false;
      }
    },

    async logout() {
      try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
      this.user = null;
    },
  };
}

// ============================================================
// 概览 Tab
// ============================================================
function overviewTab() {
  return {
    days: 7,
    loading: false,
    stats: null,

    async load() {
      this.loading = true;
      try {
        this.stats = await api(`/api/stats?days=${this.days}`);
      } catch { this.stats = null; }
      this.loading = false;
    },
  };
}

// ============================================================
// 组织管理 Tab
// ============================================================
function orgsTab() {
  return {
    loading: false,
    orgs: [],
    selectedOrg: null,
    editOrg: {},
    keys: [],
    models: [],
    showCreateOrg: false,
    showCreateKey: false,
    showModelForm: false,
    createdKey: null,
    newOrg: { name: '', slug: '' },
    newKeyName: '',
    modelForm: { id: null, name: '', protocol: 'openai', model_patterns: '', base_url: '', real_api_key: '', priority: 0 },

    async load() {
      this.loading = true;
      try { this.orgs = await api('/api/orgs'); } catch { this.orgs = []; }
      this.loading = false;
    },

    async selectOrg(org) {
      this.selectedOrg = org;
      this.editOrg = { name: org.name, slug: org.slug, is_active: org.is_active };
      await Promise.all([this.loadKeys(), this.loadModels()]);
    },

    async loadKeys() {
      try { this.keys = await api(`/api/orgs/${this.selectedOrg.id}/keys`); } catch { this.keys = []; }
    },

    async loadModels() {
      try { this.models = await api(`/api/orgs/${this.selectedOrg.id}/models`); } catch { this.models = []; }
    },

    async createOrg() {
      try {
        await api('/api/orgs', { method: 'POST', body: JSON.stringify(this.newOrg) });
        this.newOrg = { name: '', slug: '' };
        this.showCreateOrg = false;
        await this.load();
      } catch (e) { alert(e.message); }
    },

    async saveOrg() {
      try {
        const updated = await api(`/api/orgs/${this.selectedOrg.id}`, { method: 'PUT', body: JSON.stringify(this.editOrg) });
        Object.assign(this.selectedOrg, updated);
        await this.load();
      } catch (e) { alert(e.message); }
    },

    async deleteOrg() {
      if (!confirm('确定要删除该组织？此操作不可撤销。')) return;
      try {
        await api(`/api/orgs/${this.selectedOrg.id}`, { method: 'DELETE' });
        this.selectedOrg = null;
        await this.load();
      } catch (e) { alert(e.message); }
    },

    async createKey() {
      try {
        const res = await api(`/api/orgs/${this.selectedOrg.id}/keys`, { method: 'POST', body: JSON.stringify({ name: this.newKeyName }) });
        this.createdKey = res;
        this.newKeyName = '';
        this.showCreateKey = false;
        await this.loadKeys();
      } catch (e) { alert(e.message); }
    },

    async deleteKey(id) {
      if (!confirm('确定删除此 Key？')) return;
      try {
        await api(`/api/keys/${id}`, { method: 'DELETE' });
        await this.loadKeys();
      } catch (e) { alert(e.message); }
    },

    openModelForm(model = null) {
      if (model) {
        this.modelForm = { id: model.id, name: model.name, protocol: model.protocol, model_patterns: model.model_patterns, base_url: model.base_url, real_api_key: model.real_api_key, priority: model.priority };
      } else {
        this.modelForm = { id: null, name: '', protocol: 'openai', model_patterns: '', base_url: '', real_api_key: '', priority: 0 };
      }
      this.showModelForm = true;
    },

    async saveModel() {
      try {
        if (this.modelForm.id) {
          await api(`/api/models/${this.modelForm.id}`, { method: 'PUT', body: JSON.stringify(this.modelForm) });
        } else {
          await api(`/api/orgs/${this.selectedOrg.id}/models`, { method: 'POST', body: JSON.stringify(this.modelForm) });
        }
        this.showModelForm = false;
        await this.loadModels();
      } catch (e) { alert(e.message); }
    },

    async deleteModel(id) {
      if (!confirm('确定删除此模型配置？')) return;
      try {
        await api(`/api/models/${id}`, { method: 'DELETE' });
        await this.loadModels();
      } catch (e) { alert(e.message); }
    },
  };
}

// ============================================================
// 调用日志 Tab
// ============================================================
function logsTab() {
  return {
    loading: false,
    logs: [],
    orgs: [],
    total: 0,
    page: 1,
    pageSize: 20,
    filter: { org_id: '', status: '' },
    logDetail: null,

    get totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },

    async load() {
      this.loading = true;
      try {
        // 并行加载组织列表（用于筛选下拉）
        if (this.orgs.length === 0) {
          this.orgs = await api('/api/orgs');
        }
        let url = `/api/logs?page=${this.page}&pageSize=${this.pageSize}`;
        if (this.filter.org_id) url += `&org_id=${this.filter.org_id}`;
        if (this.filter.status) url += `&status=${this.filter.status}`;
        const res = await api(url);
        this.logs = res.data;
        this.total = res.total;
      } catch { this.logs = []; }
      this.loading = false;
    },

    async viewLog(id) {
      try {
        this.logDetail = await api(`/api/logs/${id}`);
      } catch (e) { alert(e.message); }
    },
  };
}

// ============================================================
// 用量统计 Tab
// ============================================================
function usageTab() {
  return {
    days: 7,
    loading: false,
    stats: null,

    get maxReq() {
      if (!this.stats) return 0;
      return Math.max(...this.stats.daily_stats.map(d => d.request_count), 0);
    },

    get maxToken() {
      if (!this.stats) return 0;
      return Math.max(...this.stats.daily_stats.map(d => d.total_tokens), 0);
    },

    async load() {
      this.loading = true;
      try {
        this.stats = await api(`/api/stats?days=${this.days}`);
      } catch { this.stats = null; }
      this.loading = false;
    },
  };
}
</script>
</body>
</html>
